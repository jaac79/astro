# =============================================================================
# OTHER MAJOR PLANETARY CYCLES IN MUNDANE ASTROLOGY
# =============================================================================

other_mundane_cycles:

  jupiter_return:
    period: "~11.86 years (approximately 12 years)"
    description: >
      Jupiter returns to its natal position in a country's foundation chart
      approximately every 12 years. This marks periods of expansion,
      prosperity, or overextension for the nation.
    mundane_effects:
      positive:
        - "Economic expansion and growth"
        - "Judicial reform and legal milestones"
        - "Religious and cultural renaissance"
        - "Diplomatic breakthroughs and international gains"
      negative:
        - "Over-expansion and inflation"
        - "Religious or ideological hubris"
        - "Excessive government spending"
    key_transits:
      - "Jupiter over natal Sun: Leadership boost, government expansion"
      - "Jupiter over natal Moon: Public welfare improvements, agricultural bounty"
      - "Jupiter over natal Saturn: Institutional reform, balance of growth and discipline"

  saturn_return:
    period: "~29.46 years (approximately 29.5 years)"
    description: >
      Saturn returns to its natal position in a country's foundation chart
      approximately every 29.5 years. This marks periods of structural testing,
      institutional crisis, and forced maturation for nations.
    mundane_effects:
      testing_areas:
        - "Constitutional crises and governance challenges"
        - "Economic recessions or structural adjustments"
        - "Infrastructure failures demanding rebuild"
        - "Social contract renegotiations"
        - "Generational power transitions"
      historical_pattern: >
        Nations often face their most defining crises at or near their Saturn
        returns. The United States experienced the Civil War near its 3rd Saturn
        return (1861), the Great Depression near its 5th (1929), and internal
        upheaval near subsequent returns.
    key_transits:
      - "Saturn over natal Sun: Government crisis, leadership tested"
      - "Saturn over natal Moon: Public hardship, agricultural crisis"
      - "Saturn over natal Mars: Military setbacks, defense restructuring"

  rahu_ketu_cycle:
    period: "~18.6 years (18 years, 7 months)"
    description: >
      The nodal axis (Rahu-Ketu) returns to its natal position approximately
      every 18.6 years. This activates the karmic themes of a nation's
      foundation chart and often brings eclipses to sensitive points.
    mundane_effects:
      - "Eclipse patterns repeat, activating similar national themes"
      - "Karmic reckoning for past national policies"
      - "Foreign relations crises or breakthroughs"
      - "Immigration and refugee issues resurface"
      - "Hidden threats (espionage, epidemics) emerge"
      - "Technology disruptions with transformative impact"
    saros_connection: >
      The 18.6-year nodal cycle is closely related to the Saros eclipse cycle
      (18 years, 11 days, 8 hours). Eclipses in the same Saros family
      share thematic connections across the centuries, making historical
      eclipse analysis valuable for mundane prediction.

  saturn_rahu_conjunction:
    period: "~11.5 years"
    description: >
      Saturn-Rahu conjunctions are among the most feared combinations in
      Medini Jyotish. They indicate periods of collective suffering,
      epidemics, mass deception, and structural crises involving foreign
      or hidden elements.
    mundane_effects:
      - "Pandemics and epidemic outbreaks"
      - "Institutional corruption exposed"
      - "Mass displacement and refugee crises"
      - "Economic manipulation and financial fraud"
      - "Terrorism and unconventional warfare"
    recent_conjunctions:
      - year: 2013
        sign: "Libra"
        events: "Syrian civil war escalation, ISIS rise, European refugee crisis building"
      - year: 2025
        sign: "Pisces"
        events: "Current cycle—themes still unfolding"

  jupiter_rahu_conjunction:
    period: "~6.5 years"
    description: >
      Jupiter-Rahu conjunctions (Guru-Chandala Yoga in natal astrology)
      in mundane context indicate periods where wisdom is corrupted,
      religious extremism rises, and financial speculation reaches excess.
    mundane_effects:
      - "Religious extremism and fanaticism"
      - "Financial bubbles and speculative excess"
      - "Corruption in judiciary and educational institutions"
      - "False prophets and misleading ideologies gain followers"
      - "Unethical expansion and growth at any cost"

# =============================================================================
# INTERPRETATION GUIDELINES
# =============================================================================

interpretation_guidelines:

  assessing_conjunction_strength:
    - "Sign dignity of both planets at conjunction (own sign, exaltation = stronger effects)"
    - "House placement in the country's ingress chart"
    - "Aspects from other planets (benefic support or malefic affliction)"
    - "Proximity to fixed stars of significance"
    - "Whether the conjunction is direct or involves retrograde motion"
    - "Nakshatra of the conjunction adds nuance (see nakshatra_mundane.yaml)"

  timing_effects:
    - "Effects begin building 1-2 years before exact conjunction"
    - "Peak effects at the conjunction and for 2-3 years after"
    - "Themes persist for the full 20-year cycle until the next conjunction"
    - "Opposition point (~10 years after conjunction) marks the crisis or fulfillment of the cycle"
    - "Square aspects (~5 and ~15 years) mark turning points within the cycle"

  country_specific_analysis:
    - "Cast the conjunction chart for the capital city of the country"
    - "Note the house placement of the conjunction relative to the country's lagna"
    - "Cross-reference with the country's foundation chart planetary positions"
    - "Check if the conjunction degree aspects or conjoins foundation chart planets"
    - "The house where the conjunction falls indicates the life-domain most affected"

# =============================================================================
# NOTES
# =============================================================================
# 1. The Jupiter-Saturn conjunction is the SINGLE most important long-term
#    cycle in mundane astrology. Always check the current conjunction context.
# 2. Great Mutations (element changes) are generational turning points that
#    define centuries—not merely decades.
# 3. The 2020 Great Mutation to Air at 0° Aquarius is considered one of the
#    most significant astrological events of the millennium.
# 4. Cross-reference with ingress_rules.yaml for the annual context.
# 5. Cross-reference with eclipse_rules.yaml for eclipses activating the
#    conjunction degree.
# 6. For country-specific analysis, see country_sign_rulerships.yaml.
