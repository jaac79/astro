# =============================================================================
# INTERPRETATION GUIDELINES
# =============================================================================

interpretation_guidelines:

  score_ranges:
    - range: "Final score >= +3.0"
      interpretation: "Strongly favorable for this domain. Expect significant positive developments."
    - range: "+1.5 to +2.9"
      interpretation: "Favorable conditions. Positive developments outweigh challenges."
    - range: "+0.5 to +1.4"
      interpretation: "Mildly favorable. Some positive movement but not dominant."
    - range: "-0.4 to +0.4"
      interpretation: "Neutral. No strong directional signal. Ordinary conditions prevail."
    - range: "-0.5 to -1.4"
      interpretation: "Mildly unfavorable. Some challenges but not severe."
    - range: "-1.5 to -2.9"
      interpretation: "Unfavorable conditions. Significant challenges and setbacks."
    - range: "Final score <= -3.0"
      interpretation: "Strongly unfavorable. Expect significant adverse developments in this domain."

  cross_domain_analysis:
    description: >
      Domains do not exist in isolation. Cross-domain interactions
      should be noted and factored into the overall assessment.
    examples:
      - "Military conflict (-2) + Economy (-1) often co-occur and reinforce each other"
      - "Natural events (-2) impacts both Economy and Public Health"
      - "Political stability (+2) generally supports Economy and Foreign Relations"
      - "Public Health crisis (-2) often leads to Economy (-1) and Markets (-1)"

  temporal_layering:
    description: >
      Score domains using multiple time-frame charts layered together
      for comprehensive assessment.
    layers:
      - layer: "Jupiter-Saturn cycle"
        timeframe: "20-year backdrop"
        weight: "Background context; sets the generational tone"
      - layer: "National chart dasha"
        timeframe: "Varies (6-20 years per mahadasha)"
        weight: "Primary timing mechanism for the nation"
      - layer: "Aries ingress chart"
        timeframe: "Annual (1 year)"
        weight: "Main annual prediction framework"
      - layer: "Seasonal ingress charts"
        timeframe: "Quarterly (3 months each)"
        weight: "Quarterly refinement of annual themes"
      - layer: "Eclipse charts"
        timeframe: "3-6 months per eclipse"
        weight: "Event triggers and theme intensifiers"
      - layer: "Transit triggers"
        timeframe: "Days to weeks"
        weight: "Precise timing of specific events"

# =============================================================================
# SIGNAL CONFIDENCE CALIBRATION (Validated Jan 2025 - Feb 2026)
# =============================================================================
# Based on 14-month validation of chart-only predictions vs real-world events.
# These empirical hit rates MUST be used to weight predictions.

signal_calibration:

  validated_period: "January 2025 through February 2026"
  validation_report: "world_readings/global/2026-03-01_validation_jan2025_feb2026.md"
  overall_accuracy: "56.3% (31.5/56 points)"

  # --- VERY HIGH CONFIDENCE signals (use boldly) ---
  very_high_confidence:

    eclipse_to_conflict:
      hit_rate: "100% (3/3 eclipse pairs)"
      rule: "Eclipse pairs ALWAYS correlate with elevated conflict"
      weight: 2.0
      note: "The most reliable Medini signal. Every eclipse pair in the
        validation period produced elevated geopolitical instability."

    mars_dignity_to_war_intensity:
      hit_rate: "~80% (8/10 months)"
      rule: "Mars dignity (exalted/own/debilitated) tracks military intensity"
      weight: 1.5
      examples:
        - "Nov 2025: Mars own sign Viruchikam → Russia launched 5,000 drones/missiles (record)"
        - "Jan 2026: Mars exalted Makaram → US captured Maduro, largest Middle East buildup since 2003"
        - "Feb 2026: Mars + Rahu in Kumbham → US-Israel struck Iran, Khamenei killed"
        - "Jan 2025: Mars debilitated + Rx → Gaza ceasefire (LOW conflict)"

  # --- HIGH CONFIDENCE signals (use with conviction) ---
  high_confidence:

    mercury_venus_direct_to_market_relief:
      hit_rate: "80% (4/5 instances)"
      rule: "Mercury and/or Venus going direct signals market relief/recovery"
      weight: 1.0

    jupiter_exalted_to_market_bullish:
      hit_rate: "100% (2/2 instances)"
      rule: "Jupiter exalted in Katakam → financial sector expansion, markets rally"
      weight: 1.5
      examples:
        - "Oct 2025: Jupiter entered Katakam → S&P hit records, Nasdaq ATH"
        - "Jun 2026: Jupiter re-entered Katakam → predicted VERY BULLISH"

    year_lord_character:
      hit_rate: "~75% directional"
      rule: "Year Lord sets the annual character (Moon 2025 = reactive/public-driven,
        Mars 2026 = aggressive/conflict-prone)"
      weight: 1.0

  # --- MODERATE CONFIDENCE signals (use as risk flag, not certainty) ---
  moderate_confidence:

    retrograde_to_sector_correction:
      hit_rate: "50% (4/8 instances)"
      rule: "Retrograde of sector planet = potential pullback, NOT certain correction"
      weight: 0.5
      caveat: "Strong earnings or policy actions can override retrograde signals.
        Jul 2025 Mercury Rx predicted bearish but Microsoft crossed $4T.
        Treat as volatility flag, not direction."

    eclipse_to_gold_spike:
      hit_rate: "67% (2/3 eclipse pairs)"
      rule: "Eclipse pairs tend to drive gold spikes via uncertainty premium"
      weight: 0.75
      caveat: "Mar 2025 gold broke $3,000 (HIT), Sep 2025 gold hit records (HIT),
        but Feb 2026 gold was elevated but not the dramatic spike predicted."

  # --- LOW CONFIDENCE signals (use only as background context) ---
  low_confidence:

    eclipse_to_market_crash:
      hit_rate: "33% (1/3 eclipse pairs)"
      rule: "Eclipse pairs do NOT reliably produce market crashes"
      weight: 0.25
      caveat: "Only worked in Mar 2025 (combined with double retrograde).
        Sep 2025 market had 8 record highs (Fed cut overrode).
        Feb 2026 market was mildly bearish (Iran strikes came last day).
        Policy decisions (rate cuts, tariffs) DOMINATE over eclipse signals."

    double_retrograde_to_severe_correction:
      hit_rate: "33% (1/3 instances)"
      rule: "Double retrograde does NOT reliably produce severe corrections"
      weight: 0.25
      caveat: "Mar 2025 worked. Jul 2025 and Oct 2026 did not."

  # --- REMOVED signals (contradicted by data) ---
  removed:

    jupiter_exalted_to_gold_dip:
      hit_rate: "0% (0/2 instances)"
      rule: "REMOVED — Jupiter exalted does NOT cause gold to dip"
      weight: 0.0
      reason: "Oct 2025: predicted gold dip → gold hit ATH $4,379.
        Post-2022, central bank sovereign buying (1,000+ tonnes/year)
        overwhelms classical rotation dynamics. Gold is now a structural
        reserve asset, not purely a fear-driven commodity."

  # --- NEW signals (discovered during validation) ---
  new_signals:

    policy_override:
      description: "Government policy decisions override planetary signals for markets"
      weight: -999
      rule: "When a major policy event (Fed rate cut, tariff announcement, trade deal)
        falls in same month as a planetary signal, the policy event DOMINATES
        market direction. Planetary signals set background mood only."
      examples:
        - "Sep 2025: Eclipse predicted BEARISH, Fed cut predicted bullish → Fed won"
        - "Apr 2025: Recovery predicted, tariff crash occurred → tariffs won"
        - "Jan 2026: Cautious-bearish predicted, market +1.5% → Warsh nomination dominated"

    country_dasha_activation:
      description: "Country's Vimsottari dasha lord intensifies domain predictions"
      weight: 1.0
      rule: "When a country enters a new maha dasha, the dasha lord's significations
        are amplified for that country. India entered Mars MD Sep 2025 →
        heightened military assertiveness confirmed by Operation Sindoor."
      command: "medini_calc.py country-dasha --name [country] --date [date]"

    transit_on_natal_chart:
      description: "Transit planets hitting natal chart positions activate specific events"
      weight: 1.0
      rule: "Use transit-overlay command to check which natal houses and planets
        are activated. Tight conjunctions (<5°) with natal planets are the
        strongest triggers."
      command: "medini_calc.py transit-overlay --country [country] --date [date]"
      examples:
        - "May 7 2025: Transit Mars conjunct India natal Mercury at 0.52° → Operation Sindoor"
        - "Jan 3 2026: Rahu on USA natal Moon, Ketu on USA H10 → Venezuela strike"

    mercury_rx_dual_nature:
      description: "Mercury retrograde is an INFLECTION POINT, not purely negative"
      weight: 0.0
      rule: "Mercury Rx produces BOTH disruption (cybersecurity, outages, regulatory)
        AND innovation (major model releases, competitive leapfrogging).
        Score tech as VOLATILE during Mercury Rx, not BEARISH."
      examples:
        - "Jul 2025 Merc Rx: 62K layoffs BUT Microsoft crossed $4T"
        - "Feb 2026 Merc Rx: cybersecurity breaches BUT GPT-5.3, Claude 4.6, GLM-5 all released"

# =============================================================================
# NOTES
# =============================================================================
# 1. The scorecard is a FRAMEWORK—astrological judgment is still required
#    to assess the relative strength and importance of indicators.
# 2. Confidence level is as important as the score itself. A high score
#    at LOW confidence is less actionable than a moderate score at HIGH.
# 3. Always note the chart basis (ingress, eclipse, dasha) for each score.
# 4. Multiple domains scoring negative simultaneously indicates a period
#    of national crisis requiring careful attention to all domains.
# 5. The modifiers are additive to the base score—the base score should
#    be set first based on the primary chart analysis.
# 6. Cross-reference with all other medini_kb reference files for
#    detailed domain-specific rules and indicators.
