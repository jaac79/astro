# Foundation Chart Schema Template
# Used by medini_calc.py to produce country/entity foundation charts.

entity:
  name: "<Country/Entity Name>"
  type: "<nation | organization | city | market>"
  foundation_event: "<Independence | Constitution | Founding | etc.>"
  date: '<YYYY-MM-DD>'
  time: '<HH:MM:SS>'
  timezone: '<UTC+/-H:MM>'
  place:
    city: "<Capital City>"
    state: "<State/Province, if applicable>"
    latitude: 0.0
    longitude: 0.0
  notes: "<Brief note on chart choice>"
  alternate_times:
    - time: '<HH:MM:SS>'
      source: "<Why this time is used>"

