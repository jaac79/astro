# =============================================================================
# 36.4 - Planetary Strength: Key Principles
# =============================================================================
planetary_strength:
  core_principle: >
    An intelligent astrologer gives more importance to the strength of planets
    in the muhurta chart than thumb rules. Not only should the rasi chart be
    strong, but also the concerned divisional chart should be strong. Planetary
    strength is more important than strictly following thumb rules.

  divisional_chart_guidelines:
    - task: "Joining a new job"
      strong_houses: ["1st (Lagna)", "6th house", "10th house"]
      charts: ["Rasi", "D-10 (Dasamsa)"]

    - task: "Starting a child's education"
      strong_houses: ["1st", "2nd", "4th", "5th"]
      charts: ["Rasi", "D-24 (Siddhamsa)"]

    - task: "Buying a new vehicle"
      strong_houses: ["1st", "4th", "A4 (Arudha of 4th)"]
      charts: ["Rasi", "D-16 (Shodasamsa)"]

    - task: "Entering a new house"
      strong_factors: ["1st and 4th from lagna", "Venus in D-4"]
      charts: ["Rasi", "D-4 (Chaturthamsa)"]

    - task: "Buying real estate"
      strong_factors: ["1st and 4th from lagna", "Mars in D-4"]
      charts: ["Rasi", "D-4 (Chaturthamsa)"]

# =============================================================================
# Vimsottari Dasa in Muhurta
# =============================================================================
vimsottari_dasa_in_muhurta:
  description: >
    Vimsottari dasa can be used to time the progress of a task started at a muhurta.
    If the maximum time period for which the task can last is known, Vimsottari dasa
    can be compressed to that period. If the task has no fixed time period of effect,
    the standard 120-year Vimsottari dasa is used.

  computation_reference: "Topic 35.4 in the chapter on Mundane Astrology"

  first_dasa_importance: >
    The first dasa as per Vimsottari dasa should belong to a favorable planet
    in the chart. The effect of a muhurta lasts only for a few months or a couple
    of years; the strength of one's natal chart is more important in the long run.
    For example, selecting a muhurta with excellent rasi and D-10 charts for
    joining a new job may still yield bad results if the first dasa belongs to the
    8th lord in D-10.

# =============================================================================
# Transits with Muhurtas
# =============================================================================
transits_with_muhurtas:
  description: >
    Transits can be used with muhurta charts just as with natal charts.
    The meanings of divisional charts can be adapted to muhurtas.

  chart_roles:
    rasi: "Chart of physical manifestation - transits show when physical events occur"
    navamsa: "Chart of dharma and inner self - transits show when the intended purpose is served"
    dasamsa: "Chart of achievements in society - transits show how the venture is received and when it becomes popular"

# =============================================================================
# Illustrative Examples from the Book
# =============================================================================
examples:
  - number: 141
    description: "Muhurta for Sri A.B. Vajpayee's swearing-in as India's PM (May 1996)"
    chart_reference: "Chart 84"
    analysis: >
      Rasi chart was strong: lagna lord Sun in 10th, 10th lord Venus in 11th,
      5th lord Jupiter in 5th, strong 9th house. However, unfavorable sakuna
      karana was running and Chaturdasi tithi (14th lunar day) is usually
      not considered auspicious. D-30 was weak with Venus as a strong maraka
      afflicting lagna. Venus dasa was running (Moon in Venusian constellation).
    outcome: >
      Vajpayee remained in power only 13 days due to D-30 weakness.
      However, the strength of the rasi chart ensured his return within
      a couple of years.
    lesson: "D-30 weakness can indicate premature end despite strong rasi chart."

  - number: 142
    description: "Muhurta for Vajpayee's second swearing-in (March 1998)"
    chart_reference: "Chart 85"
    analysis: >
      Lagna lord in 9th with Uttamaamsa. Saturn owns 9th and 10th in 11th
      with Uttamaamsa. Basically strong chart. However, 3rd lord Moon debilitated
      in 7th (not conducive to long life). Gulika within 1 degree from lagna
      is undesirable.
    outcome: >
      Lost vote of confidence in April 1999 but remained as caretaker PM.
      Position improved in October 1999 elections.
    vimsottari_analysis: >
      Compressed to 5 years. 8th constellation Satabhisha stronger than Moon's
      constellation. Ketu antardasa in Jupiter dasa ran during April 3-17, 1999.
      Jupiter owns 8th house (troubles). Ketu co-lord of 7th, afflicts 8th lord
      (fall of government). Next antardasa belonged to lagna lord Venus,
      lord of Sanjivani mantra - Vajpayee remained as caretaker PM.

  - number: 143
    description: "Muhurta for the author starting to write this book"
    chart_reference: "Chart 86"
    tithi: "Saptami (7th lunar day - auspicious)"
    yoga: "Vriddhi yoga (growth)"
    karana: "Vanija"
    rasi_analysis: >
      Lagna lord Moon in lagna in Paarijaataamsa. Moon in constellation of
      Mercury (significator of writing). Venus in 11th in own sign in Gopuraamsa.
      Exalted 2nd lord Sun and 3rd lord Mercury in 10th. Mars (10th lord, yogakaraka)
      in Gopuraamsa in 2nd. Parivartana between 2nd and 10th lords favorable
      for karma related to astrology. Jupiter aspects lagna and Moon closely,
      also aspects 3rd house of writing, though debilitated.
    navamsa_analysis: >
      Lagna in Pisces (saattwik sign owned by Jupiter). Jupiter aspects lagna
      from 7th. Exalted 3rd lord Venus in lagna, owns 11th in rasi. Mercury
      in 3rd in navamsa, owns 3rd in rasi. Mars strong in 9th in own sign.
      Sun in 10th in both rasi and navamsa.
    hora_analysis: >
      Hora of Jupiter running at muhurta time. Jupiter in author's natal
      2nd house of speech. In natal D-24, Jupiter in Pisces (10th house)
      showing saattwik activities related to fine knowledge.
    transit_effects: >
      Saturn transiting Aries (containing 2nd lord Sun and 3rd lord Mercury)
      during 1998-2000 delayed progress. After Jupiter entered Aries, author
      restarted. In April 2000 Sun entered its muhurta position (Aries) and
      the project restarted with vigor. Almost 40% of the book was written
      in April-May 2000. After Saturn left Aries, the other 60% was finished.
    lesson: "Navamsa strength is crucial for dharmik activities; transits over muhurta positions time events."

# =============================================================================
# 36.5 - Conclusion and Key Takeaways
# =============================================================================
conclusion:
  key_emphasis: >
    The importance of analyzing planetary positions in muhurta charts just as
    in natal charts is emphasized, as many books leave out this important aspect.
    One should analyze the rasi and relevant divisional charts of a muhurta
    just as in the case of natal charts.

  practical_guidelines:
    - "Planetary strength in the muhurta chart matters more than rigid thumb rules."
    - "Both the rasi chart and the relevant divisional chart should be strong."
    - "The first Vimsottari dasa planet should be favorable in the muhurta chart."
    - "Hora lord at the muhurta time should be favorable in the native's natal chart."
    - "Tarabala (nakshatra compatibility) of Moon at muhurta time should be checked against birth nakshatra."
    - "Transits over muhurta chart positions can be used to time future developments."
    - "Navamsa chart strength is especially important for dharmic activities."
    - "Divisional chart meanings can be adapted for muhurta analysis (D-10 for career, D-4 for property, etc.)."

  note_on_thumb_rules: >
    The guidelines in Table 79 are merely thumb rules. Expert astrologers
    often flout these norms with considerable success. The basic point behind
    rules like 'keep the 7th house empty in wedding muhurta' is to avoid
    afflictions. If the 7th house has benefics giving great yogas, that
    should not cause problems.
