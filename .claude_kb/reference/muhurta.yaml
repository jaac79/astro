# =============================================================================
# Muhurta (Electional Astrology) - Reference
# Source: Vedic Astrology: An Integrated Approach by P.V.R. Narasimha Rao
# Chapter 36 - Muhurta or Electional Astrology
# Book pages: 412-420 | PDF pages: 416-424
# =============================================================================

source:
  book: "Vedic Astrology: An Integrated Approach"
  author: "P.V.R. Narasimha Rao"
  chapter: 36
  chapter_title: "Muhurta or Electional Astrology"
  book_pages: "412-420"
  pdf_pages: "416-424"
  recommended_reference: "Dr. B.V. Raman's book on muhurta (modern English language)"

# =============================================================================
# 36.1 - Introduction: What is Muhurta
# =============================================================================
definition:
  meaning: >
    Muhurta is the practice of choosing an auspicious time (electional astrology)
    for starting new ventures. When a new task is freshly started, the planetary
    position at that time decides how the task progresses, just as the planetary
    position at birth decides how a person's life progresses.
  alternate_name: "Electional Astrology"
  panchaanga_note: >
    Panchaanga means an almanac that lists auspicious and inauspicious times.
    It literally means 'one with five limbs'.

  applications:
    - "Getting married"
    - "Joining a new job"
    - "Swearing-in ceremonies (political leaders)"
    - "Starting a new company"
    - "Starting a child's formal education"
    - "Baby's first eating of cooked rice (annaprasana)"
    - "Buying a vehicle"
    - "Buying a house"
    - "Housewarming (entering a new house)"
    - "Baby showers"
    - "Getting a haircut"
    - "Cutting nails"

  controversies: >
    Different guidelines are given in different classics and different conventions
    are in vogue in different regions of India.

# =============================================================================
# 36.2 - Definition of Muhurta: What Constitutes the Moment
# =============================================================================
defining_the_moment:
  general_principle: >
    The muhurta moment is when actual work or purpose begins, not merely
    signing papers or formalities. One must decide intelligently on a case-by-case
    basis what constitutes 'starting' the task.

  specific_definitions:
    joining_a_new_job:
      description: >
        Accepting a job offer is like conception. Starting the actual work is akin
        to a baby being born. One should start doing actual work at the muhurta time,
        not just sign papers.

    marriage:
      hindu: >
        The time when the bridegroom ties the mangal sutra knot, as the purpose
        of marriage is living together and the mangal sutra symbolizes this.
      christian: >
        The time when the bride and bridegroom are pronounced man and wife
        after saying 'I do'.

    entering_a_new_house:
      description: >
        The correct time is when one starts 'living' in the house, not merely
        entering with suitcases. In Hindu tradition, only a house where cooking
        is done is a place of living. Traditionally, people warm milk on a stove
        at the time of muhurta. If milk is warmed for making sweet rice for
        offering Gods as prasaad, that symbolizes the starting of life in the house.

# =============================================================================
# 36.3 - Basics of Muhurta: Panchanga Elements
# =============================================================================
panchanga_five_limbs:
  description: >
    Tithi, yoga, karana, weekday, and nakshatra form the 5 limbs of panchaanga.
    When deciding a muhurta, we try to choose a good tithi, weekday, yoga,
    karana, nakshatra, and lagna.

  elements:
    - name: "Tithi"
      role: "Lunar day - specific tithis are preferred for different tasks"
    - name: "Vaara (Weekday)"
      role: "Day of the week - certain weekdays are auspicious for certain tasks"
    - name: "Nakshatra"
      role: "Lunar mansion occupied by Moon - must be favorable for the task"
    - name: "Yoga"
      role: "Luni-solar combination - one of the 5 limbs of panchaanga"
    - name: "Karana"
      role: "Half of a tithi - one of the 5 limbs of panchaanga"

  additional_factors:
    lagna: "The ascendant at the time of muhurta; specific lagnas preferred per task"

    tarabala:
      description: >
        The nakshatra occupied by Moon at the time of muhurta should be a good
        tara (star) with respect to the person's janma nakshatra (birth nakshatra).

    hora:
      description: >
        The lord of the running hora (hour) should be a favorable planet in the
        natal chart, especially with respect to the house to which the activity belongs.
      importance: "Hora is a very important quantum of time."
      examples:
        - task: "Wedding"
          hora_requirement: >
            Should belong to a favorable planet in the natal chart with respect
            to the 7th house and upapada.
        - task: "Moving to a new house"
          hora_requirement: >
            Should belong to a favorable planet in the natal chart with respect
            to the 4th house and A4.
          warning: >
            If a planet owns the 8th house from the 4th house and occupies a
            badhaka sthana from A4, then it may be disastrous to move into
            a new house in that planet's hora.

