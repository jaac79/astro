# =============================================================================
# Floodlight Scorecard Framework
# =============================================================================
# Source: Methodology derived from P.V.R. Narasimha Rao's "Vedic Astrology:
#         An Integrated Approach" — synthesizing dignities (Ch 3), functional
#         nature (Ch 13), yogas (Ch 11), aspects (Ch 10), and strength (Ch 15).
#
# Purpose: For ANY specific question, enumerate ALL indicators on both sides,
#          weight each by strength, sum, and let the majority rule.
#          The scorecard IS the analysis; the narrative explains it.
# =============================================================================

framework:
  name: "Floodlight Scorecard"
  principle: >
    Spotlight analysis finds 1-3 strong combinations and builds a narrative.
    Floodlight analysis enumerates ALL relevant combinations on both sides,
    weights each by dignity and condition, sums the tallies, and lets the
    majority rule. The scorecard is constructed BEFORE the narrative.
    The narrative EXPLAINS the scorecard — it does not replace it.

  # ---------------------------------------------------------------------------
  # Weight Scale — 5-point base, modified by conditions
  # ---------------------------------------------------------------------------
  weight_scale:
    description: "Base weight assigned to each indicator based on the graha's dignity/condition"
    levels:
      - score: 5
        label: "Exalted / Own sign / Yogakaraka"
        description: "Graha in uccha rasi, swakshetra, or designated yogakaraka for lagna"
      - score: 4
        label: "Moolatrikona / Great friend sign"
        description: "Graha in moolatrikona or in a great friend's rasi"
      - score: 3
        label: "Friend sign / Moderate dignity"
        description: "Graha in a friend's rasi, functionally well-placed"
      - score: 2
        label: "Neutral sign / Mixed condition"
        description: "Graha in a neutral rasi, neither helped nor harmed"
      - score: 1
        label: "Enemy sign / Debilitated / Combust"
        description: "Graha in neecha rasi, enemy sign, or combust"

  # ---------------------------------------------------------------------------
  # Modifiers — applied on top of base weight
  # ---------------------------------------------------------------------------
  modifiers:
    positive:
      - modifier: "+1.0"
        condition: "Yogakaraka for lagna"
        reference: "Table 30, Ch 13"
      - modifier: "+0.5"
        condition: "Functional benefic for lagna"
        reference: "Table 30, Ch 13"
      - modifier: "+0.5"
        condition: "Receiving benefic aspect (Guru/Shukra/waxing Chandra/unafflicted Budha)"
        reference: "Ch 10"
      - modifier: "+0.5"
        condition: "Retrograde in own or exalted sign (amplified strength)"
        reference: "Ch 15"
      - modifier: "+0.5"
        condition: "Vargottama (same rasi in D-1 and D-9)"
        reference: "Ch 6"
      - modifier: "+0.5"
        condition: "High SAV in occupied bhava (28+ bindus)"
        reference: "Ch 12"
    negative:
      - modifier: "-1.0"
        condition: "Combust (within Sun's combustion orb)"
        reference: "Ch 15"
      - modifier: "-0.5"
        condition: "Functional malefic for lagna"
        reference: "Table 30, Ch 13"
      - modifier: "-0.5"
        condition: "Receiving malefic aspect (Shani/Mangal/Rahu)"
        reference: "Ch 10"
      - modifier: "-0.5"
        condition: "Retrograde in debilitation (amplified weakness)"
        reference: "Ch 15"
      - modifier: "-0.5"
        condition: "Low SAV in occupied bhava (below 25 bindus)"
        reference: "Ch 12"
      - modifier: "-0.5"
        condition: "In planetary war (graha yuddha) and losing"
        reference: "Ch 15"
      - modifier: "-0.5"
        condition: "In gandanta (junctional degrees between water-fire signs)"
        reference: "Ch 15"

  # ---------------------------------------------------------------------------
  # Verdict Computation
  # ---------------------------------------------------------------------------
  computation:
    formula: "NET = FAV_TOTAL - UNFAV_TOTAL"
    margin_formula: "MARGIN = |NET| / (FAV_TOTAL + UNFAV_TOTAL)"
    direction: >
      If NET > 0, direction is FAVORABLE.
      If NET < 0, direction is UNFAVORABLE.
      If NET = 0, direction is INDETERMINATE.

  # ---------------------------------------------------------------------------
  # Confidence Thresholds
  # ---------------------------------------------------------------------------
  confidence:
    thresholds:
      - level: "HIGH"
        margin: "≥ 0.60"
        description: "Strong majority on one side — verdict is clear"
      - level: "MODERATE"
        margin: "0.35 – 0.59"
        description: "Clear lean but minority factors are meaningful"
      - level: "LOW"
        margin: "0.15 – 0.34"
        description: "Slight lean — outcome genuinely uncertain"
      - level: "INDETERMINATE"
        margin: "< 0.15"
        description: "Too close to call — factors nearly balanced"
    integration: >
      Final reading confidence = LOWER of:
        (1) Dasha convergence confidence (from multi-system convergence)
        (2) Scorecard margin confidence
      This prevents a high-margin scorecard from masking low dasha convergence.

  # ---------------------------------------------------------------------------
  # Transparency Rules
  # ---------------------------------------------------------------------------
  transparency:
    rules:
      - "Always show Shadbala column — use 'N/A' when not computed, never omit"
      - "Always show AV/SAV column — use 'N/A' when not computed, never omit"
      - "List ALL indicators found, even weak ones — do not cherry-pick"
      - "If fewer than 5 indicators on either side, flag as 'THIN EVIDENCE'"
      - "Always include a Limitations section listing what was NOT checked"
      - "Never manufacture narrative certainty the numbers do not support"
      - "The scorecard table MUST appear BEFORE the narrative explanation"

  # ---------------------------------------------------------------------------
  # Scorecard Table Format
  # ---------------------------------------------------------------------------
  table_format:
    favorable:
      columns:
        - "# (row number)"
        - "Indicator (what factor and why favorable)"
        - "Graha/Bhava (which graha or bhava)"
        - "Dignity (uccha/swa/moola/friend/neutral/enemy/neecha)"
        - "Shadbala (rank or N/A)"
        - "AV (bindus or N/A)"
        - "Base (1-5)"
        - "Modifiers (+/- adjustments)"
        - "Final Score"
    unfavorable:
      columns:
        - "# (row number)"
        - "Indicator (what factor and why unfavorable)"
        - "Graha/Bhava (which graha or bhava)"
        - "Dignity"
        - "Shadbala (rank or N/A)"
        - "AV (bindus or N/A)"
        - "Base (1-5)"
        - "Modifiers (+/- adjustments)"
        - "Final Score"
    verdict:
      fields:
        - "Favorable Total"
        - "Unfavorable Total"
        - "NET"
        - "MARGIN"
        - "Confidence (HIGH / MODERATE / LOW / INDETERMINATE)"
        - "Direction (FAVORABLE / UNFAVORABLE / INDETERMINATE)"

# =============================================================================
# Topic Checklists — Starting Points for Indicator Enumeration
# =============================================================================
# Each checklist provides 10-12 favorable and 8-10 unfavorable indicators.
# The agent MUST also add any additional relevant factors found in the chart.
# These are starting points, not exhaustive lists.
# =============================================================================

