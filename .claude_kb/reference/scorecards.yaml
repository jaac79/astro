        rationale: "2nd house = accumulated wealth, savings, family resources"
        reference: "Ch 7 — houses.yaml"
      - indicator: "11th lord strong and well-placed"
        rationale: "11th house = gains, income, fulfillment of desires"
        reference: "Ch 7 — houses.yaml"
      - indicator: "9th lord strong (bhagya — fortune)"
        rationale: "9th house = luck, fortune, divine grace supporting wealth"
        reference: "Ch 7 — houses.yaml"
      - indicator: "5th lord strong (purva punya — past merit)"
        rationale: "5th house = past-life credit, speculative gains, windfalls"
        reference: "Ch 7 — houses.yaml"
      - indicator: "Guru strong by dignity and placement"
        rationale: "Guru is naisargika karaka for wealth and expansion"
        reference: "Ch 8 — karakas.yaml"
      - indicator: "Dhana yogas present and activated"
        rationale: "Combinations of 2nd/11th lords with kendras/trikonas"
        reference: "Ch 11 — yogas.yaml"
      - indicator: "Dasha lord owns or aspects 2nd/11th"
        rationale: "Current timing activates wealth houses"
        reference: "Ch 16 — vimsottari_dasa.yaml"
      - indicator: "Guru transiting favorable position from Chandra"
        rationale: "Guru transit in 2/5/7/9/11 from Moon is classically favorable"
        reference: "Ch 25 — transits.yaml"
      - indicator: "Benefics in 2nd or 11th bhava"
        rationale: "Natural benefics strengthen wealth houses from within"
        reference: "Ch 10 — aspects_argalas.yaml"
