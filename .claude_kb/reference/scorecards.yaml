# =============================================================================
# Usage Notes for the Agent
# =============================================================================
usage_notes:
  - "These checklists are STARTING POINTS — always add chart-specific indicators"
  - "Every indicator must be assessed against the ACTUAL chart, not assumed"
  - "An indicator not found in the chart is OMITTED, not scored as zero"
  - "Weight each found indicator using the 5-point scale + modifiers"
  - "Present the scorecard table BEFORE writing narrative"
  - "The narrative EXPLAINS the scorecard — it does not override it"
  - "If fewer than 5 indicators on either side, flag as THIN EVIDENCE"
  - "Cross-check with dasha convergence — final confidence is the LOWER of both"
  - "For timing/muhurta questions, use both the timing checklist AND the topic checklist"
  - "Mini-scorecards (3-5 indicators per side) are acceptable for sub-sections of larger readings"
