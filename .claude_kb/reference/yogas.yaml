# =============================================================================
# DARIDRA YOGAS (Poverty Combinations) - Section 11.10
# =============================================================================
daridra_yogas:
  section: "11.10"
  description: "Combinations that produce poverty."
  note_on_marakas: "2nd and 7th houses are maraka (killer houses). Their lords are marakas (killers). Any malefics occupying 2nd and 7th or associating with 2nd and 7th lords also become marakas."

  yogas:
    - number: 1
      formation:
        - "Lagna lord is in 12th and 12th lord is in lagna."
        - "They are conjoined or aspected by a maraka planet."

    - number: 2
      formation:
        - "Lagna lord is in 6th and 6th lord is in lagna."
        - "They are conjoined or aspected by a maraka planet."

    - number: 3
      formation:
        - "Lagna or Moon is with Ketu."
        - "Lagna lord is in 8th."
        - "A maraka planet conjoins or aspects lagna lord."

    - number: 4
      formation:
        - "Lagna lord is with a malefic in a dusthana (6th, 8th or 12th)."
        - "2nd lord is debilitated or in an enemy's sign."
      note: "Even a royal scion with this combination becomes poor."

    - number: 5
      formation:
        - "5th lord is in 6th and 9th lord is in 12th, with aspects from marakas."

    - number: 6
      formation:
        - "Malefics occupy lagna without 9th and 10th lords, aspected or conjoined by marakas."

    - number: 7
      formation:
        - "Lords of the signs occupied by 6th, 8th and 12th lords are in 6th, 8th and 12th houses."
        - "Conjoined or aspected by malefics."

    - number: 8
      formation:
        - "Lord of the sign occupied by Moon in navamsa is with a maraka or occupies a maraka house (2nd or 7th)."

    - number: 9
      formation:
        - "Lords of lagna in rasi and navamsa are conjoined or aspected by marakas."

    - number: 10
      formation:
        - "Benefics are in malefic houses and malefics are in benefic houses."

    - number: 11
      formation:
        - "Planets conjoined by 6th, 8th and 12th lords give loss of wealth in their dasas."
      exception: "If they are conjoined or aspected by lords of trines, this is mitigated."

    - number: 12
      formation:
        - "Mars and Saturn are in 2nd and Mercury does not aspect them."
      exception: "If Mercury aspects Mars and Saturn in 2nd, great wealth is generated instead."

    - number: 13
      formation:
        - "Sun in 2nd is aspected by Saturn."
      exception: "If Saturn does not aspect, Sun in 2nd gives wealth."

  general_principles:
    - "Dusthanas (6th, 8th, 12th) and their lords are detrimental to wealth."
    - "If lagna, lagna lord and trine lords are afflicted by dusthana lords, one may be poor."
    - "Conjunction or aspect of marakas clinches the issue."
    - "Conjunction or aspect of trine lords is a saving factor."
    - "Planets in the 2nd house and the strength of 2nd lord matter."

# =============================================================================
# CONCLUSION - Section 11.11
# =============================================================================
conclusion:
  section: "11.11"
  key_points:
    - "Practice yogas on real charts to develop quick identification ability."
    - "When looking at results ascribed to yogas, fit them into today's world (e.g., Kamala yoga may make one a Prime Minister, not literally a king)."
    - "When using yogas in divisional charts, adapt results to the matters signified by that chart."
    - "All great results may not materialize due to weaknesses in the yoga."
    - "Unless a yoga is very strong, all results cannot be expected."
    - "Just one yoga cannot make or break a personality unless it is very powerful."
    - "In yogas with many conditions, partial results may be experienced even if not all conditions are satisfied."
