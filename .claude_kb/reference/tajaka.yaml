# ==============================================================================
# Chapter 29: Tajaka Yogas (Book pages 342-349, PDF pages 347-354)
# ==============================================================================
chapter_29_tajaka_yogas:
  title: "Tajaka Yogas"
  book_pages: "342-349"
  pdf_pages: "347-354"
  overview: >
    Special combinations with special results applicable to Tajaka annual/monthly
    charts as well as prasna (horary) charts. There are 16 Tajaka yogas. Some
    yogas overlap and an ithasala may be converted to another yoga under
    additional conditions.

  planet_speed_order: >
    In increasing order of speed: Saturn, Rahu/Ketu, Jupiter, Mars, Sun,
    Venus, Mercury, Moon.

  yogas:
    # ------ 1. Ishkavala (Ikbaal) Yoga ------
    - number: 1
      name: "Ishkavala (Ikbaal)"
      section: "29.2.1"
      definition: >
        Planets occupy only kendras (1st, 4th, 7th, 10th houses) and
        panapharas (2nd, 5th, 8th, 11th houses) while apoklimas
        (3rd, 6th, 9th, 12th houses) are empty.
      formation_conditions:
        - "All planets must be in kendras or panapharas"
        - "All apoklimas must be empty"
      results: "Wealth, happiness and good fortune"

    # ------ 2. Induvara Yoga ------
    - number: 2
      name: "Induvara"
      section: "29.2.2"
      definition: >
        Planets occupy only apoklimas (3rd, 6th, 9th, 12th houses)
        while kendras and panapharas are empty.
      formation_conditions:
        - "All planets must be in apoklimas (3, 6, 9, 12)"
        - "Kendras and panapharas must be empty"
      results: "Disappointments, worries and illnesses"

    # ------ 3. Ithasala Yoga ------
    - number: 3
      name: "Ithasala"
      section: "29.2.3"
      definition: >
        Two planets have an aspect and the faster moving planet is less
        advanced in its rasi than the slower moving planet. In western
        astrology this is called an "applying aspect".
      formation_conditions:
        - "Two planets must have an aspect (conjunction, sextile, square, trine, opposition, semi-sextile)"
        - "The faster moving planet must be less advanced in its rasi than the slower one"
        - "Both planets should be within the deeptaamsa (orb) of each other"
      results: >
        Good yoga showing fulfilment of matters represented by the two planets.
        Ithasala between lagna lord and 7th lord (or vivaha saham lord or Venus)
        shows possible marriage.
      types:
        vartamaana:
          meaning: "Present (current)"
          condition: "Planets aspect each other and both are within the deeptaamsa of the other"
          result: "Fulfilment of matters"
        poorna:
          meaning: "Complete"
          condition: "Planets aspect closely and their advancements in respective rasis are within 1 degree of each other"
          result: "Most powerful ithasala; speedy fulfilment"
        bhavishya:
          meaning: "Future"
          condition: "Vartamaana ithasala is about to be formed when the faster moving planet moves by 1 degree or less"
          result: "Fulfilment after obstructions or delay"
      retrogression_notes:
        - "If faster planet is retrograde, generally no ithasala (planets won't reach same advancement)"
        - "If slower planet is retrograde, no problem - faster realization actually"
        - "If faster planet is retrograde AND more advanced, both move toward each other = ithasala"
        - "If faster planet is about to become retrograde before reaching exact aspect, no ithasala"

    # ------ 4. Eesarpha Yoga ------
    - number: 4
      name: "Eesarpha"
      section: "29.2.4"
      definition: >
        The opposite of ithasala. Two planets have an aspect and the faster
        moving planet has a higher advancement in its rasi than the slower planet.
      formation_conditions:
        - "Two planets have an aspect"
        - "Faster moving planet is MORE advanced in its rasi than the slower planet"
      results: >
        Bad yoga causing failures and disappointments. Lagna lord eesarpha with
        5th lord/putra saham lord/Jupiter = disappointments related to children.
        Lagna lord eesarpha with 10th/5th lord or rajya saham lord or Sun for a
        leader = loss of power.
      retrogression_notes:
        - "If faster planet is retrograde and less advanced = eesarpha"
        - "If faster planet is retrograde and more advanced = ithasala (not eesarpha)"

    # ------ 5. Nakta Yoga ------
    - number: 5
      name: "Nakta"
      section: "29.2.5"
      definition: >
        Two planets have an aspect but no ithasala or eesarpha. A third planet
        that moves faster than both has an aspect with both and forms ithasala
        with both.
      formation_conditions:
        - "Two planets have an aspect but no ithasala or eesarpha"
        - "A third faster planet forms ithasala with both"
      results: >
        Fulfilment of matters represented by the first two planets with the help
        of someone shown by the third planet.

    # ------ 6. Yamaya Yoga ------
    - number: 6
      name: "Yamaya"
      section: "29.2.6"
      definition: >
        Two planets have an aspect but no ithasala or eesarpha. A third planet
        that moves slower than both has an aspect with both and forms ithasala
        with both.
      formation_conditions:
        - "Two planets have an aspect but no ithasala or eesarpha"
        - "A third SLOWER planet forms ithasala with both"
      results: >
        Fulfilment of matters represented by the first two planets with help
        from someone shown by the third planet, but after obstacles and delays.

    # ------ 7. Manahoo (Manaau) Yoga ------
    - number: 7
      name: "Manahoo (Manaau)"
      section: "29.2.7"
      definition: >
        Two planets have an ithasala yoga but Saturn or Mars is in conjunction
        with the faster moving planet within the latter's deeptaamsa.
      formation_conditions:
        - "Two planets have an ithasala yoga"
        - "Saturn or Mars is in conjunction with the faster moving planet"
        - "Saturn/Mars must be within the deeptaamsa of the faster planet"
        - "If Mars or Saturn is one of the two ithasala planets, the other (Saturn/Mars) is needed"
      results: >
        Cancels the ithasala yoga. Gives failures, disappointments, quarrels,
        loss of wealth. One of Mars or Saturn is enough to spoil ithasala.
      note: >
        Some authors suggest aspect (not just conjunction) of Saturn/Mars within
        deeptaamsa is sufficient. However, readers are advised to consider only conjunction.

    # ------ 8. Kamboola Yoga ------
    - number: 8
      name: "Kamboola"
      section: "29.2.8"
      definition: >
        Two planets have an ithasala yoga and Moon has an ithasala with one
        of the planets (or both).
      formation_conditions:
        - "Two planets have an ithasala yoga"
        - "Moon has an ithasala with one or both of those planets"
      results: >
        Adds power to the ithasala yoga. The power added varies based on the
        strength of Moon and other planets.

    # ------ 9. Gairi-Kamboola Yoga ------
    - number: 9
      name: "Gairi-Kamboola"
      section: "29.2.9"
      definition: >
        Moon is in the last degree of a rasi and will form ithasala with one of
        the planets in an ithasala after moving to the next rasi. Essentially
        Kamboola yoga in waiting.
      formation_conditions:
        - "Two planets have an ithasala yoga"
        - "Moon is in the last degree of a rasi"
        - "Moon will form ithasala with one of the ithasala planets after entering the next rasi"
        - "Moon must also form ithasala with a strong planet"
        - "Moon should NOT be exalted, debilitated, or in own navamsa/drekkana/hadda"
      results: "Realization of the matter with help from others, after some delay"

    # ------ 10. Khallasara Yoga ------
    - number: 10
      name: "Khallasara"
      section: "29.2.10"
      definition: >
        Lagna lord is in the rasi between Moon and another planet X without
        ithasala with either.
      formation_conditions:
        - "Lagna lord is positioned in the zodiac between Moon and planet X"
        - "Lagna lord has no ithasala with Moon or planet X"
      results: "Destroys the signification of planet X"

    # ------ 11. Radda Yoga ------
    - number: 11
      name: "Radda"
      section: "29.2.11"
      definition: >
        An ithasala yoga involves a planet in debilitation, retrogression,
        combustion, or otherwise weak.
      formation_conditions:
        - "An ithasala yoga exists"
        - "One of the planets is debilitated, retrograde, combust, or otherwise weak"
      results: "Negates ithasala and gives bad results"

    # ------ 12. Duhphali-Kutta Yoga ------
    - number: 12
      name: "Duhphali-Kutta"
      section: "29.2.12"
      definition: >
        In an ithasala, the faster planet is exalted or in own rasi or has good
        panchavargeeya bala, while the slower planet is not exalted, not in own
        rasi, and weak in panchavargeeya bala.
      formation_conditions:
        - "Two planets have ithasala"
        - "Faster planet is strong (exalted/own rasi/good PVB)"
        - "Slower planet is weak (not exalted/not own rasi/low PVB)"
      results: "Realization of ambitions and dreams"
      note: "The text description mentions Saturn (slower) exalted and Mars (faster) weak for this yoga name, suggesting the naming convention may focus on the contrast."

    # ------ 13. Duttota (Dutthotttha Davira) Yoga ------
    - number: 13
      name: "Duttota"
      section: "29.2.13"
      definition: >
        Two planets in an ithasala are both weak (debilitated or in inimical
        rasis, low PVB), but one of them has an ithasala with a strong planet
        (exalted or own rasi, high PVB).
      formation_conditions:
        - "Two weak planets have ithasala"
        - "One of the two has ithasala with a strong planet"
      results: "Good results despite initial weakness"

    # ------ 14. Thambira (Tambira) Yoga ------
    - number: 14
      name: "Thambira (Tambira)"
      section: "29.2.14"
      definition: >
        A planet is in the last degree of a rasi and forms ithasala with a
        slower moving planet after moving to the next rasi.
      formation_conditions:
        - "Planet is in the last degree of a rasi (e.g. 29 deg+)"
        - "Currently no ithasala with slower planet"
        - "After moving to next rasi, ithasala will form"
      results: "Realization of hopes after delay and hard work"

    # ------ 15. Kutta Yoga ------
    - number: 15
      name: "Kutta"
      section: "29.2.15"
      definition: >
        A planet occupying lagna is aspected by a planet in own or exaltation
        rasi in a kendra or a panaphara.
      formation_conditions:
        - "A planet occupies lagna"
        - "It is aspected by a planet in own/exaltation rasi"
        - "The aspecting planet must be in a kendra or panaphara"
      results: "Desires related to the matters signified by the planet in lagna are fulfilled"
      note: "This yoga was interpreted differently by various scholars"

    # ------ 16. Durupha Yoga ------
    - number: 16
      name: "Durupha"
      section: "29.2.16"
      definition: >
        Ithasala given by two planets in dusthanas (6th, 8th, 12th house)
        in combustion or retrogression or debilitation.
      formation_conditions:
        - "Two planets have ithasala"
        - "Both are in dusthanas (6th, 8th, or 12th house)"
        - "Both are in combustion, retrogression, or debilitation"
      results: "Planets are powerless to give any good results"

# ==============================================================================
# Chapter 30: Annual Dasas (Book pages 350-359, PDF pages 355-364)
# ==============================================================================
chapter_30_annual_dasas:
  title: "Annual Dasas"
  book_pages: "350-359"
  pdf_pages: "355-364"
  overview: >
    Dasa systems compressed to a one-year period for timing events within
    a Tajaka annual chart. Three systems are covered: Patyayini dasa,
    Mudda dasa (Varsha Vimsottari dasa), and Varsha Narayana dasa.

  # --------------------------------------------------------------------------
  # 30.3 Patyayini Dasa
  # --------------------------------------------------------------------------
  patyayini_dasa:
    section: "30.3"
    also_known_as: "Varsha dasa (per Dr. B.V. Raman)"
    description: >
      Based on the longitudes of lagna and all seven planets.
      Specifically meant for Tajaka charts. Applicable to both annual
      and monthly charts.
    procedure:
      step_1: >
        Consider lagna and seven planets. Find their advancement from
        the beginning of the respective signs. Arrange in ascending order.
        These are called "Krisamsas".
      step_2: >
        Leave the krisamsa of the first planet (lowest value). For all
        others, subtract the krisamsa of the previous planet. These
        differences are called "Patyamsas".
      step_3: >
        Dasas run in the order found in step 1. Duration of each dasa
        (in days) = 365.2425 x (its patyamsa / sum of all patyamsas).
        The sum of all patyamsas equals the largest krisamsa.
      step_4: >
        Antardasas use the same ratios and order as dasas (like Vimsottari).
        First antardasa within a dasa is the dasa planet itself.
    example_table_75:
      description: "Patyayini Dasa Calculation (Example 122)"
      entries:
        - {planet: "Venus", krisamsa: "1d38m", patyamsa: "1d38m", fraction: 0.0684, days: 24.98}
        - {planet: "Mercury", krisamsa: "4d47m", patyamsa: "3d09m", fraction: 0.1319, days: 48.17}
        - {planet: "Moon", krisamsa: "4d49m", patyamsa: "0d02m", fraction: 0.0014, days: 0.51}
        - {planet: "Saturn", krisamsa: "6d30m", patyamsa: "1d41m", fraction: 0.0705, days: 25.74}
        - {planet: "Lagna", krisamsa: "7d14m", patyamsa: "0d44m", fraction: 0.0307, days: 11.21}
        - {planet: "Jupiter", krisamsa: "10d59m", patyamsa: "3d45m", fraction: 0.1570, days: 57.35}
        - {planet: "Sun", krisamsa: "17d05m", patyamsa: "6d06m", fraction: 0.2554, days: 93.29}
        - {planet: "Mars", krisamsa: "23d53m", patyamsa: "6d48m", fraction: 0.2847, days: 103.99}

  # --------------------------------------------------------------------------
  # 30.4 Mudda Dasa (Varsha Vimsottari Dasa)
  # --------------------------------------------------------------------------
  mudda_dasa:
    section: "30.4"
    also_known_as: "Varsha Vimsottari Dasa"
    description: >
      Vimsottari dasa with 120 years compressed to a solar year (360 solar days,
      where each solar day = period in which Sun moves by 1 degree). Dasa days
      for a planet = normal dasa years x 3.
    table_76_dasa_days:
      description: "Varsha Vimsottari Dasa durations in solar days"
      entries:
        Sun: 18
        Moon: 30
        Mars: 21
        Rahu: 54
        Jupiter: 48
        Saturn: 57
        Mercury: 51
        Ketu: 21
        Venus: 60
      total_solar_days: 360
    dasa_order:
      description: >
        Progress Moon's natal constellation at the rate of one constellation
        per year. Alternatively:
      planet_numbering:
        Sun: 1
        Moon: 2
        Mars: 3
        Rahu: 4
        Jupiter: 5
        Saturn: 6
        Mercury: 7
        Ketu: 8
        Venus: 9
      procedure: >
        Take the number corresponding to the lord of Moon's natal constellation
        (first Vimsottari dasa lord in natal chart). Add the number of completed
        years. Divide by 9 and take the remainder (0 = Venus/9). That planet's
        dasa comes first, followed by the normal Vimsottari order.
    dasa_balance: >
      The fraction of natal Moon's constellation yet to be traversed gives
      the balance of the first dasa.

  # --------------------------------------------------------------------------
  # 30.5 Varsha Narayana Dasa
  # --------------------------------------------------------------------------
  varsha_narayana_dasa:
    section: "30.5"
    description: >
      Narayana dasa compressed from 120 years to 360 solar days.
      If a rasi's dasa is n years in Narayana dasa, it becomes (3 x n)
      solar days in Varsha Narayana dasa. This is the best dasa for
      Tajaka annual charts according to the author.
    key_difference_from_natal: >
      Progress natal lagna by one rasi per year (i.e. use muntha as lagna)
      instead of using lagna in the annual chart. This links the natal chart
      to the Tajaka chart.
    dasa_order: >
      Same as Narayana dasa of the relevant divisional chart but using
      muntha (progressed natal lagna) instead of annual chart lagna.
    applicability:
      - "Can be computed for any divisional chart"
      - "For D-9: use 9th lord in rasi chart to determine starting sign"
      - "For D-4: use 4th lord in rasi chart"
      - "For D-7: use 7th lord in rasi chart"
      - "For D-24: use 12th lord from muntha"
    saturn_exception: >
      The Saturn exception from Narayana dasa applies. If Saturn is in the
      starting sign, dasa order direction may reverse.
    ranking: "Best annual dasa (better than Patyayini, which is better than Mudda)"

  conclusion: >
    Patyayini dasa is applicable to both annual and monthly charts.
    For annual charts, Varsha Narayana dasa and Patyayini dasa give
    the best results. If a result seems likely in an annual chart, the
    exact month or week of the event can be found using these dasas.

# ==============================================================================
# Chapter 31: Sudarsana Chakra Dasa (Book pages 360-366, PDF pages 365-371)
# ==============================================================================
chapter_31_sudarsana_chakra_dasa:
  title: "Sudarsana Chakra Dasa"
  book_pages: "360-366"
  pdf_pages: "365-371"
  overview: >
    Parasara said Sudarsana Chakra dasa was taught by Brahma Himself and is
    a great tool for predicting daily, monthly and annual fortune. Though
    covered in the Tajaka part, this is actually a natal dasa like Vimsottari
    dasa, Narayana dasa and Kalachakra dasa.

  # --------------------------------------------------------------------------
  # 31.2 Sudarsana Chakra
  # --------------------------------------------------------------------------
  sudarsana_chakra:
    section: "31.2"
    description: >
      Three concentric circles drawn with bhava chakra from three
      reference points: lagna (inner, physical body), Moon (middle, mind),
      and Sun (outer, soul). All three together represent one's self.
    three_references:
      lagna: "Physical body"
      moon: "Mind"
      sun: "Soul"
    drawing: >
      Draw 3 concentric circles. Write the bhava chakra with respect to
      lagna, Moon and Sun in the inner, middle and outer charts respectively.

  # --------------------------------------------------------------------------
  # 31.3 Dasa Computation
  # --------------------------------------------------------------------------
  dasa_computation:
    section: "31.3"
    description: >
      Dasas of the 12 houses run in cycles throughout life. Each dasa
      lasts one year (solar year).
    rules:
      - "Dasa of the 1st house runs in the 1st year, 2nd house in the 2nd year, etc."
      - "After 12 years, the cycle repeats (1st house dasa returns in 13th year)"
      - "A new SC dasa starts at each solar return (Tajaka annual chart timing)"
    formula: >
      Take (completed_years + 1), divide by 12, take remainder.
      If remainder is 0, make it 12. The remainder gives the house
      whose dasa runs in that year.
    three_references: >
      The Nth house is reckoned from lagna, Moon, and Sun. Ideally all
      three should be analyzed, but for simplification one may choose the
      strongest reference among lagna, Moon, and Sun.

  # --------------------------------------------------------------------------
  # Antardasas and Pratyantardasas
  # --------------------------------------------------------------------------
  antardasas:
    description: >
      Each dasa is divided into 12 antardasas. Take the dasa sign as lagna
      and assign the 1st, 2nd, 3rd etc. houses from it to successive antardasas.
    timing: "Tajaka monthly charts give the date and time when an antardasa starts"
    pratyantardasas: >
      Similarly found from antardasas. Tajaka sixty-hour charts give the
      timing of pratyantardasas.

  # --------------------------------------------------------------------------
  # Link to Tajaka System
  # --------------------------------------------------------------------------
  link_to_tajaka:
    description: >
      Tajaka annual, monthly and sixty-hour charts are the entry charts
      of dasas, antardasas and pratyantardasas as per Sudarsana Chakra dasa.
    muntha_connection: >
      Muntha in Tajaka annual charts is the SC dasa sign reckoned from lagna.
      If we redefine muntha to be progressed from the strongest of lagna, Moon
      and Sun (instead of always from lagna), it exactly becomes the SC dasa sign.

  # --------------------------------------------------------------------------
  # 31.4 Dasa Interpretation
  # --------------------------------------------------------------------------
  dasa_interpretation:
    section: "31.4"
    method: >
      Take the dasa sign (or antardasa/pratyantardasa sign) as lagna and
      analyze planetary positions at the commencement of the dasa
      (i.e. from the Tajaka chart), NOT natal positions.
    favorable_placements:
      - "Benefics in quadrants (1, 4, 7, 10) from dasa sign"
      - "Benefics in trines (5, 9) from dasa sign"
      - "Benefics in 8th from dasa sign"
      - "Benefics in houses other than 6th and 12th"
      - "Malefics in the 3rd, 6th, and 11th houses"
    unfavorable_placements:
      - "Malefics in houses other than 3rd, 6th, 11th"
      - "Rahu destroys the house he occupies"
    note: >
      Using natal positions would suggest same results every 12 years, which
      is not logical. Parasara clearly advised using transit positions at dasa
      commencement.

  # --------------------------------------------------------------------------
  # SC Dasa for Divisional Charts
  # --------------------------------------------------------------------------
  divisional_chart_application:
    description: >
      SC dasa can be found for all divisional charts. Take the strongest of
      lagna, Moon and Sun, then start SC dasa from there, moving one house
      per year.
    special_attention: "Pay special attention to rasi chart"

  conclusion: >
    Sudarsana Chakra dasa is good at showing favorable and unfavorable
    periods in a general sense. There may be missing links between
    Sudarsana Chakra dasa and Tajaka analysis that need further research.
