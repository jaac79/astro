      - number: 21
        name: "Paradesa"
        meaning: "Foreign countries"
        formula_day: "9thHouse - 9thLord + Lagna"
        formula_night: "9thHouse - 9thLord + Lagna"
        notes: "Same formula for day and night"

      - number: 22
        name: "Artha"
        meaning: "Money"
        formula_day: "2ndHouse - 2ndLord + Lagna"
        formula_night: "2ndHouse - 2ndLord + Lagna"
        notes: "Same formula for day and night"

      - number: 23
        name: "Paradara"
        meaning: "Adultery"
        formula_day: "Venus - Sun + Lagna"
        formula_night: "Sun - Venus + Lagna"
        notes: null

      - number: 24
        name: "Vanik"
        meaning: "Commerce"
        formula_day: "Moon - Mercury + Lagna"
        formula_night: "Mercury - Moon + Lagna"
        notes: null

      - number: 25
        name: "Karyasiddhi"
        meaning: "Success in endeavours"
        formula_day: "Saturn - Sun + Lord of Sun-sign"
        formula_night: "Saturn - Moon + Lord of Moon-sign"
        notes: "Day/night formulas are different (not simply reversed)"

      - number: 26
        name: "Vivaha"
        meaning: "Marriage"
        formula_day: "Venus - Saturn + Lagna"
        formula_night: "Saturn - Venus + Lagna"
        notes: null

      - number: 27
        name: "Santapa"
        meaning: "Sadness"
        formula_day: "Saturn - Moon + 6thHouse"
