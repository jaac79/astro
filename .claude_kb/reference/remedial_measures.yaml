# =============================================================================
# Section 34.6 - Conclusion
# =============================================================================

conclusion:
  section: "34.6"
  note: >
    This book is only an introductory textbook of integrated Vedic astrology.
    No topic has been covered exhaustively. The coverage of the topics in
    Part 5 (Special Topics) is particularly brief. The purpose is to make
    readers familiar with some practical aspects of Vedic astrology. Readers
    should refer to other books for more details, particularly Vedic Remedies
    in Astrology by Pt. Sanjay Rath.
