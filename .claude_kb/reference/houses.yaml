# Section 7.3 - Common References for Houses
common_references:
  lagna:
    description: "Default reference. Shows true self. The overall spirit of 'I' (self)."
  chandra_lagna:
    description: "Moon taken as reference. Shows things from the perspective of mind."
  ravi_lagna:
    description: "Sun taken as reference. Shows things from the perspective of soul. Important for physical vitality."
  arudha_lagna:
    description: "Shows how a native is perceived in the world. Also shows status of a native."
  paaka_lagna:
    description: "Lagna lord taken as reference. Important for natal chart, dasas and transits. Shows matters related to physical self."
  karakamsa_lagna:
    description: "Atma karaka's navamsa rasi. Important for inner self analysis. 12th from Karakamsa shows liberation of soul."
  ghati_lagna:
    description: "Shows self from point of view of power, authority and fame. Important for career/political power analysis."
  hora_lagna:
    description: "Shows self from point of view of wealth. Important for wealth analysis."
  graha_lagnas:
    description: "Planetary references. Each planet as natural significator can be taken as reference for its house."
    planet_house_mapping:
      Sun: "9th (father), 10th (career, achievements)"
      Moon: "4th (mother), 1st (mind), 2nd, 11th, 9th"
      Mars: "3rd (courage, siblings)"
      Mercury: "6th (enemies, service)"
      Jupiter: "5th (children)"
      Venus: "7th (marriage)"
      Saturn: "8th (longevity), 12th (losses)"

# Four Purushaarthas (purposes/goals of human existence)
purushaarthas:
  dharma:
    meaning: "Righteousness and adherence to one's duty"
    trikona: [1, 5, 9]
    order: 1
  artha:
    meaning: "Money and career"
    trikona: [2, 6, 10]
    order: 2
  kaama:
    meaning: "Desiring things and getting them"
    trikona: [3, 7, 11]
    order: 3
  moksha:
    meaning: "Final liberation of soul"
    trikona: [4, 8, 12]
    order: 4

notes:
  - "Houses are found with respect to lagna, special lagnas, and some planets."
  - "Houses are found in rasi chart and in all the divisional charts."
  - "The matters signified by a house depend on the reference used and the divisional chart."
  - "Each rasi is a house. The rasi containing the reference point is the 1st house."
  - "Trines, quadrants, etc. can be found from any house, not just lagna."
  - "Planets in mutual trines make each other prosper."
  - "Planets in mutual quadrants have a sustaining effect on each other."
  - "Derived houses: We can concatenate house meanings. E.g., 2nd from 3rd (=4th) shows wealth/speech of younger brother."
