# Section 7.4 - Special Categories of Houses
categories:
  trikonas:
    houses: [1, 5, 9]
    also_known_as: ["konas", "trines"]
    description: "Abode of Goddess Lakshmi who rules prosperity. Beneficial to the reference. Bring prosperity and well-being."
    quick_summary: "Prosperity and flourishing"

  kendras:
    houses: [1, 4, 7, 10]
    also_known_as: ["quadrants", "angles"]
    description: "Abode of Sri Maha Vishnu who sustains the universe. Sustaining effect on the reference."
    quick_summary: "Sustenance and vital activity"

  panapharas:
    houses: [2, 5, 8, 11]
    also_known_as: ["succedants"]
    description: "Basically the quadrants from the 2nd house."

  apoklimas:
    houses: [3, 6, 9, 12]
    also_known_as: ["precedants"]
    description: "Basically the quadrants from the 3rd house."

  upachayas:
    houses: [3, 6, 10, 11]
    also_known_as: []
    description: "Forces causing gains and growth to the matters signified by the reference."
    quick_summary: "Gains and growth"

  dusthanas:
    houses: [6, 8, 12]
    also_known_as: ["trik sthanas", "bad/evil houses"]
    description: "Forces causing setbacks to the matters signified by the reference. If fortified or afflicted by malefics, may show serious obstacles. If weak, obstacles will be easily overcome."
    quick_summary: "Setbacks and obstacles"

  chaturasras:
    houses: [4, 8]
    also_known_as: []
    description: "The 4th and 8th houses."

  marakas:
    houses: [2, 7]
    also_known_as: ["maraka sthanas", "killer houses"]
    description: "Houses associated with death and ending of life. The 2nd and 7th houses and their lords can act as marakas (death-inflicting agents)."

  # Trikona sub-categories based on 4 Purushaarthas (purposes of human existence)
  dharma_trikona:
    houses: [1, 5, 9]
    also_known_as: ["trines of duty"]
    description: "Show prosperity of self, intelligence and dharma. The character of a person, intelligence and righteousness decide how one follows dharma - the first purpose of human existence."
    purushaarta: "Dharma - righteousness and adherence to one's duty"

  artha_trikona:
    houses: [2, 6, 10]
    also_known_as: ["trines of money"]
    description: "Show money related activities. 2nd house shows wealth, 6th house shows service, 10th house shows career and activities in society. These show how one follows artha - the second purpose of human existence."
    purushaarta: "Artha - money and career"

  kama_trikona:
    houses: [3, 7, 11]
    also_known_as: ["trines of desire"]
    description: "Show one's desires and how one gets them. 3rd house shows one's persistence, 7th house shows relations and sex, 11th house shows gains. These show how one follows kaama - the third purpose of human existence."
    purushaarta: "Kaama - desiring things and getting them"

  moksha_trikona:
    houses: [4, 8, 12]
    also_known_as: ["trines of liberation"]
    description: "4th house - harmony, 8th house - occult studies and spiritual awakening, 12th house - moksha. These show how one follows moksha - the fourth purpose of human existence."
    purushaarta: "Moksha - final liberation of soul"

# Section 7.4.5 - Visible and Invisible Halves
zodiac_halves:
  visible_half:
    houses: [7, 8, 9, 10, 11, 12]
    description: "Results that can be seen in the material world."
  invisible_half:
    houses: [1, 2, 3, 4, 5, 6]
    description: "Results that cannot be easily seen."
  note: "Bases of dharma trikona (1st) and moksha trikona (4th) are in the invisible half. Bases of artha trikona (10th) and kaama trikona (7th) are in the visible half."

# Section 7.4.6 - Quick Summary of Categories
quick_summary:
  trines: "Prosperity and flourishing"
  quadrants: "Sustenance and vital activity"
  upachayas: "Gains and growth"
  dusthanas: "Setbacks and obstacles"
  argala_sthanas: "Decisive influences"

