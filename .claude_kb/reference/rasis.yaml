source: "Vedic Astrology: An Integrated Approach, P.V.R. Narasimha Rao"
chapter: 2
pages: "6, 19-23"

# Classification groupings for reference
classifications:
  odd_even:
    odd:
      aliases: [vishama, oja, male]
      rasis: [Ar, Ge, Le, Li, Sg, Aq]
    even:
      aliases: [sama, yugma, female]
      rasis: [Ta, Cn, Vi, Sc, Cp, Pi]
    usage: "Used in some dasas and in determination of the sex of children."

  odd_footed_even_footed:
    odd_footed:
      aliases: [vishamapada, ojapada]
      rasis: [Ar, Ta, Ge, Li, Sc, Sg]
    even_footed:
      aliases: [samapada, yugmapada]
      rasis: [Cn, Le, Vi, Cp, Aq, Pi]
    usage: "Used in some dasas."

  movable_fixed_dual:
    movable:
      sanskrit: chara
      ruler: Brahma
      nature: "To move and to be dynamic"
      rasis: [Ar, Cn, Li, Cp]
    fixed:
      sanskrit: sthira
      ruler: Shiva
      nature: "To be stable and constant"
      rasis: [Ta, Le, Sc, Aq]
    dual:
      sanskrit: dwiswabhava
      ruler: Vishnu
      nature: "Stable sometimes and dynamic sometimes"
      rasis: [Ge, Vi, Sg, Pi]

  elements:
    fire:
      sanskrit: agni
      rasis: [Ar, Le, Sg]
    earth:
      sanskrit: bhoo
      rasis: [Ta, Vi, Cp]
    air:
      sanskrit: vaayu
      rasis: [Ge, Li, Aq]
    water:
      sanskrit: jala
      rasis: [Cn, Sc, Pi]
    note: "The 5th element of aakaasa (ether) is present in every rasi."

  ayurveda_nature:
    pitta:
      aliases: [bilious]
      description: "Combination of fire and water. Shows transformation/digestion."
      rasis: [Ar, Le, Sg]
    vaata:
      aliases: [windy]
      description: "Combination of air and ether. Shows movement in and out of a system, e.g. breathing."
      rasis: [Ta, Vi, Cp]
    kapha:
      aliases: [phlegmatic]
      description: "Combination of earth and water. Binds a system together, e.g. bones, muscles, fat."
      rasis: [Cn, Sc, Pi]
    mixed:
      rasis: [Ge, Li, Aq]

  gunas:
    saattwik:
      quality: "Purity, truthfulness"
      rasis: [Cn, Le, Sg, Pi]
    raajasik:
      quality: "Energy, passion"
      rasis: [Ar, Ta, Li, Sc]
    taamasik:
      quality: "Darkness, depravity"
      rasis: [Ge, Vi, Cp, Aq]

  directions:
    east: [Ar, Le, Sg]
    south: [Ta, Vi, Cp]
    west: [Ge, Li, Aq]
    north: [Cn, Sc, Pi]

  day_night:
    night:
      sanskrit: nishaa
      note: "Strong during night time. Moon governs all nishaa rasis."
      rasis: [Ar, Ta, Ge, Cn, Sg, Cp]
    day:
      sanskrit: divaa
      note: "Strong during day time. Sun governs all divaa rasis."
      rasis: [Le, Vi, Li, Sc, Aq, Pi]
    note: "Of the two rasis owned by a planet, one is a day sign and one is a night sign."

  rising:
    seershodaya:
      meaning: "Head first (rises with head)"
      note: "Planets in Seershodaya rasis give results in the first half of their dasas."
      rasis: [Ge, Le, Vi, Li, Sc, Aq]
    prishthodaya:
      meaning: "Feet first (rises with feet; strictly 'prishtha' means back)"
      note: "Planets in Prishthodaya rasis give results in the second half of their dasas."
      rasis: [Ar, Ta, Cn, Sg, Cp]
    both:
      meaning: "Rises with both head and feet"
      rasis: [Pi]

  varna:
    brahmana:
      meaning: "Scholars, priests, ministers"
      element: water
      rasis: [Cn, Sc, Pi]
    kshatriya:
      meaning: "Warriors, kings, army chiefs, soldiers"
      element: fire
      rasis: [Ar, Le, Sg]
    vaisya:
      meaning: "Traders, suppliers of services"
      element: earth
      rasis: [Ta, Vi, Cp]
    sudra:
      meaning: "Workers, menial tasks"
      element: air
      rasis: [Ge, Li, Aq]

  limbs_of_vishnu:
    note: "The whole zodiac is a manifestation of Lord Vishnu's body."
    mapping:
      Ar: head
      Ta: face
      Ge: arms
      Cn: heart
      Le: stomach
      Vi: hip
      Li: "navel (space below navel)"
      Sc: private parts
      Sg: thighs
      Cp: knees
      Aq: ankles
      Pi: feet

# Lordship / Rulership
lords:
  Sun: [Le]
  Moon: [Cn]
  Mars: [Ar, Sc]
  Mercury: [Ge, Vi]
  Jupiter: [Sg, Pi]
  Venus: [Ta, Li]
  Saturn: [Cp, Aq]
  Rahu: [Aq]    # co-lord
  Ketu: [Sc]    # co-lord
  note: "Rahu co-lords Aquarius with Saturn. Ketu co-lords Scorpio with Mars."

