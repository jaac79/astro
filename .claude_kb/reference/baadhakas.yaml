title: "Baadhakas"

# Rules for determining badhaka sthana (troubling spot):
# For a house falling in a movable/fixed/dual rasi, the 11th/9th/7th house
# (respectively) from there becomes baadhaka sthaana (troubling spot).
# Its lord is called a "baadhaka" (troublemaker) for the original house.
#
# Summary:
#   Movable signs (chara rasis): 11th house is badhaka sthana
#   Fixed signs (sthira rasis):   9th house is badhaka sthana
#   Dual signs (dwiswabhava):     7th house is badhaka sthana
#
# Usage notes from the text:
# - The periods of the badhaka lord and planets in the badhaka rasi can create
#   some obstructions and troubles related to the matters of the original house.
# - Baadhaka can be considered from every house and arudha pada in every
#   divisional chart.
# - Example: If lagna in someone's D-10 is in Mithuna, then Jupiter is baadhaka
#   for lagna. The periods of Jupiter and planets in Dhanus can create some
#   obstructions and troubles in career.

rules:
  movable_signs: "11th house is badhaka sthana"
  fixed_signs: "9th house is badhaka sthana"
  dual_signs: "7th house is badhaka sthana"

