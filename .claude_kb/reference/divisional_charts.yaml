# =============================================================================
# Computation Quick Reference
# =============================================================================
computation_quick_reference:
  description: >
    Summary of starting signs for divisional chart computation.
    For each chart, determine the part number based on the planet's position
    within the sign, then count forward from the starting sign.
  by_odd_even:
    - chart: "D-3"
      method: "fixed offsets: 1st, 5th, 9th from rasi"
    - chart: "D-5"
      odd: "Ar, Aq, Sg, Ge, Li"
      even: "Ta, Vi, Pi, Cp, Sc"
    - chart: "D-6"
      odd: "start from Aries"
      even: "start from Libra"
    - chart: "D-7"
      odd: "start from same rasi"
      even: "start from 7th from rasi"
    - chart: "D-10"
      odd: "start from same rasi"
      even: "start from 9th from rasi"
    - chart: "D-24"
      odd: "start from Leo"
      even: "start from Cancer"
    - chart: "D-40"
      odd: "start from Aries"
      even: "start from Libra"
  by_modality:
    - chart: "D-8"
      movable: "Aries"
      fixed: "Sagittarius"
      dual: "Leo"
    - chart: "D-16"
      movable: "Aries"
      fixed: "Leo"
      dual: "Sagittarius"
    - chart: "D-20"
      movable: "Aries"
      fixed: "Sagittarius"
      dual: "Leo"
    - chart: "D-45"
      movable: "Aries"
      fixed: "Leo"
      dual: "Sagittarius"
  by_element:
    - chart: "D-9"
      fiery: "Aries"
      earthy: "Capricorn"
      airy: "Libra"
      watery: "Cancer"
    - chart: "D-27"
      fiery: "Aries"
      earthy: "Cancer"
      airy: "Libra"
      watery: "Capricorn"
  from_same_rasi:
    - chart: "D-1"
      rule: "identity mapping"
    - chart: "D-4"
      rule: "offsets 1, 4, 7, 10"
    - chart: "D-12"
      rule: "start from same rasi"
    - chart: "D-60"
      rule: "start from same rasi"
  special:
    - chart: "D-2"
      rule: "Sun's hora / Moon's hora based on odd/even rasi and first/second half"
    - chart: "D-11"
      rule: "Anti-zodiacal counting from Aries to determine start rasi"
    - chart: "D-30"
      rule: "Unequal parts; fixed mapping for odd and even rasis"

