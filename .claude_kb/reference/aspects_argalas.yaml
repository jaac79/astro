    saturn: [3, 7, 10]

  rasi_drishti_summary:
    movable_to_fixed: "Aspects all fixed signs except adjacent one"
    fixed_to_movable: "Aspects all movable signs except adjacent one"
    dual_to_dual: "Aspects all other dual signs"

  argala_summary:
    primary_argala: [2, 4, 11]
