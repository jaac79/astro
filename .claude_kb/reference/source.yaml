title: "Vedic Astrology: An Integrated Approach"
author: "P.V.R. Narasimha Rao"
publisher: "Sagar Publications"
publisher_address: "72 Janpath, Ved Mansion, New Delhi 110001"
first_published: 2001
reprinted: 2004
isbn: null  # not listed in the edition scanned

author_background: |
  B.Tech in Electrical & Electronics Engineering from IIT Madras (1987-1991).
  Masters from Rice University, Houston, USA (1991-1993).
  Software engineer near Boston, USA.
  Two Sanskrit diplomas: Sansh-ita Bhaashaa Kovida (Bharatiya Vidya Bhavan, age 10)
  and Sanskrita Bhaashaa Visaarada (Baroda, age 11, with distinction).
  Designated Jyotish Guru at Sri Jagannath Vedic Centre.

dedication:
  - "Sri P. Venkata Subrahmanyachalapathi Rao (father and first guru)"
  - "Dr. B.V. Raman (immortal author)"
  - "Pt. Sanjay Rath (guru, founder of Sri Jagannath Vedic Centre)"

approach: |
  Integrated approach combining Parasara and Jaimini traditions.
  De-emphasizes the incorrect "Parasari vs Jaimini" distinction.
  All concepts (arudha padas, argalas, chara karakas, rasi dasas)
  were taught by Sage Parasara in Brihat Parasara Hora Sastram.

companion_software: "Jagannatha Hora Lite (free, www.sjvc.net)"

