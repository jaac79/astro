# Arudha Padas - Chapter 9
# Source: Vedic Astrology: An Integrated Approach by P.V.R. Narasimha Rao
# Book pages: 72-84, PDF pages: 81-93

source:
  book: "Vedic Astrology: An Integrated Approach"
  author: "P.V.R. Narasimha Rao"
  chapter: 9
  title: "Arudha Padas"
  book_pages: "72-84"
  pdf_pages: "81-93"

# ---------------------------------------------------------------------------
# Section 9.1 - Introduction (book page 72, PDF page 81)
# ---------------------------------------------------------------------------
introduction:
  section: "9.1"
  page_ref: "book p.72 / PDF p.81"
  concept: >
    Lagna shows true self. However, people's perceptions of a person can be
    different from reality. Usually, how one is perceived by others is more
    important in material life than who one really is.
  key_principle: >
    Arudha padas help astrologers separate reality from perceptions and
    understand both correctly - the true nature of a person and how he is
    perceived by the world.
  distinction:
    lagna: "Shows true self (reality)"
    arudha_padas: "Show maya (illusion) - how one is perceived in the material world"
  when_to_use_perceptions:
    - "Success of a politician in elections"
    - "Success in a competitive examination"
    - "Promotion at office"
  when_to_use_true_self:
    - "Predicting internal matters"
    - "Understanding the true nature of a person"

# ---------------------------------------------------------------------------
# Section 9.2 - Computation of Bhava Arudhas (book pages 72-75, PDF pages 81-84)
# ---------------------------------------------------------------------------
computation_of_bhava_arudhas:
  section: "9.2"
  page_ref: "book p.72-75 / PDF p.81-84"
  definition: >
    Arudha padas of all the 12 houses (bhavas) in all the divisional charts
    are computed using a specific formula.
  steps:
    - step: 1
      instruction: >
        Take the sign containing the house of interest in the divisional
        chart of interest.
    - step: 2
      instruction: >
        Find the sign occupied by the lord of that house.
      note: >
        Aquarius is owned by Saturn and Rahu. Scorpio is owned by Mars and
        Ketu. Take the stronger lord in the case of houses falling in these
        two signs. Refer to the chapter on "Strength of Planets and Rasis"
        for comparison rules.
    - step: 3
      instruction: >
        Count signs from the house of interest to the sign containing its
        lord. Counting is in the zodiacal direction always.
      example: >
        If the house is in Gemini and its lord Mercury is in Aquarius, count
        signs from Gemini to Aquarius and get 9.
    - step: 4
      instruction: >
        Count the same number of signs from the sign containing the lord and
        find the ending sign.
      example: >
        Count 9 signs from Aquarius and end up in Libra.
    - step: 5
      instruction: >
        EXCEPTION: If the sign found in step (4) is in the 1st or 7th from
        the original sign in step (1), then take the 10th sign from the sign
        found in step (4). Otherwise, make no change.
    - step: 6
      instruction: >
        The resulting sign contains the arudha pada of the house of interest.

  notation:
    general: "Arudha pada of nth house is denoted as An (e.g., A4, A9)"
    special_cases:
      AL: "Arudha pada of lagna (1st house) = Arudha Lagna"
      UL: "Arudha pada of 12th house = Upapada Lagna"

  formula_summary: >
    If house H is in sign S, and lord of S is in sign L:
    Count N = number of signs from S to L (zodiacal).
    Count N signs from L to get result sign R.
    If R is the same as S (1st) or 7th from S, take the 10th from R instead.

# ---------------------------------------------------------------------------
# Table 18 - Specific Names of Arudha Padas (book page 75, PDF page 84)
# ---------------------------------------------------------------------------
arudha_pada_names:
  section: "Table 18"
  page_ref: "book p.75 / PDF p.84"
