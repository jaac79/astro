      alternate_names:
        - "Arudha lagna"
        - "Pada lagna"
        - "Arudha"
        - "Pada"
      abbreviation: "AL"
      signifies: "Self as perceived by the world; status; material image"
    A2:
      house: 2
      alternate_names:
        - "Dhanarudha"
        - "Vittarudha"
        - "Dhana pada"
        - "Vitta pada"
      signifies: "Maya related to wealth and family"
    A3:
      house: 3
      alternate_names:
        - "Bhatrarudha"
        - "Bhratri pada"
        - "Vikramarudha"
        - "Vikrama pada"
      signifies: "Maya related to boldness, courage, communication, weapons, books/articles written"
    A4:
      house: 4
      alternate_names:
        - "Matri pada"
        - "Vahana pada"
        - "Sukha pada"
        - "Matrarudha"
        - "Vahanarudha"
        - "Sukharudha"
      signifies: "Maya related to happiness, vehicles, education environment (school/university in D-24)"
    A5:
      house: 5
      alternate_names:
        - "Mantra pada"
        - "Mantrarudha"
        - "Putrarudha"
        - "Putra pada"
        - "Buddhi pada"
      signifies: "Maya related to intelligence, following, mantras, religious rituals (D-20), power/awards (D-10), exam scores (D-24)"
    A6:
      house: 6
      alternate_names:
        - "Roga pada"
        - "Satru pada"
        - "Rogarudha"
        - "Satrarudha"
      signifies: "Maya related to disease and enemies"
    A7:
      house: 7
      alternate_names:
        - "Dara pada"
        - "Dararudha"
      signifies: "Maya related to relationships; kind of people one associates with"
    A8:
      house: 8
      alternate_names:
        - "Mrityu pada"
        - "Kashta pada"
        - "Kashtarudha"
        - "Randhrarudha"
