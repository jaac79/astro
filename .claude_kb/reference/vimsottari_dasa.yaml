# ---------------------------------------------------------------------------
# COMPUTATION OF DASA BALANCE AT BIRTH
# ---------------------------------------------------------------------------
dasa_balance_at_birth:
  description: >
    The fraction of the first dasa remaining at birth is computed from how
    much of the birth nakshatra Moon has yet to traverse.
  nakshatra_length: "13 degrees 20 minutes (13d20m = 800 arc-minutes)"
  steps:
    - step: 1
      action: "Find the constellation (nakshatra) occupied by Moon at birth."
    - step: 2
      action: "Find the advancement of Moon within that constellation."
    - step: 3
      action: >
        Compute the fraction of the constellation yet to be traversed by Moon:
        fraction = (nakshatra_length - moon_advancement) / nakshatra_length
    - step: 4
      action: "First dasa belongs to the lord of that constellation."
    - step: 5
      action: "Find the dasa sequence starting from this lord using the cyclic order in Table 38."
    - step: 6
      action: >
        Multiply the full dasa length of the first planet by the fraction from step 3.
        This gives the remaining dasa balance at birth. The rest of that planet's
        dasa was already over before birth.
  example:
    birth: "2000 April 28, 5:50 AM (TZ: 4W of GMT)"
    moon_position: "2 deg 23 min in Aquarius"
    nakshatra: "Dhanishtha (23Cp20 to 06Aq40)"
    moon_advancement: "9 deg 03 min"
    fraction_remaining: "(13d20m - 9d03m) / 13d20m = 4d17m / 13d20m = 257/800 = 0.32125"
    first_dasa_lord: "Mars (lord of Dhanishtha)"
    mars_dasa_balance: "7 x 0.32125 = 2.24875 years = 2 years 2 months 29 days 33 ghatis"
    note: "1 ghati = 1/60th of a day = 24 minutes"

  year_definition_controversy:
    description: >
      What constitutes a 'year' in dasa computation is debated.
    options:
      - "Solar year: 365.2425 days (used by most scholars including Pt. Sanjay Rath)"
      - "Savana year: 360 days (used by the author P.V.R. Narasimha Rao, based on his father's teaching)"
      - "Moon traversing 360 constellations"
      - "360 tithis (luni-solar days)"
    book_preference: "Savana years (360 days) used in all nakshatra dasa calculations in this book"

# ---------------------------------------------------------------------------
# ANTARDASA (BHUKTI) COMPUTATION
# ---------------------------------------------------------------------------
antardasa_computation:
  description: >
    Each mahadasa is divided into 9 antardasas (sub-periods), one for each planet.
  rules:
    - "First antardasa within a mahadasa belongs to the same planet as the mahadasa lord."
    - "Subsequent antardasas follow the same cyclic order as the mahadasa sequence."
    - >
      The total mahadasa length is distributed among the 9 antardasas in the
      ratio of the respective mahadasa years of the planets.
  formula: >
    Length of antardasa of planet X in mahadasa of planet Y =
    (dasa_years_of_Y * dasa_years_of_X) / 120
  example:
    mahadasa: Venus
    mahadasa_years: 20
    antardasa_order:
      - planet: Venus
        duration: "20*20/120 = 3 years 4 months"
      - planet: Sun
        duration: "20*6/120 = 1 year"
      - planet: Moon
        duration: "20*10/120 = 1 year 8 months"
      - planet: Mars
        duration: "20*7/120 = 1 year 2 months"
      - planet: Rahu
        duration: "20*18/120 = 3 years"
      - planet: Jupiter
        duration: "20*16/120 = 2 years 8 months"
      - planet: Saturn
        duration: "20*19/120 = 3 years 2 months"
      - planet: Mercury
        duration: "20*17/120 = 2 years 10 months"
      - planet: Ketu
        duration: "20*7/120 = 1 year 2 months"
  first_dasa_note: >
    For the first dasa at birth, do NOT divide the remainder into antardasas.
    Instead, divide the COMPLETE duration of the first dasa into 9 antardasas.
    Some antardasas may have already been over before birth; only the
    remaining ones apply.

# ---------------------------------------------------------------------------
# PRATYANTARDASA COMPUTATION
# ---------------------------------------------------------------------------
pratyantardasa_computation:
  description: >
    Each antardasa is further divided into 9 pratyantardasas using the
    same proportional method. The same procedure applies recursively for
    sookshma dasas, prana dasas, and deha dasas.
  formula: >
    Length of pratyantardasa of planet Z in antardasa of planet X in
    mahadasa of planet Y =
    (dasa_years_of_Y * dasa_years_of_X * dasa_years_of_Z) / (120 * 120)
  recursive_principle: >
    The same proportional subdivision method applies at every level:
    antardasa -> pratyantardasa -> sookshma dasa -> prana dasa -> deha dasa.

# ---------------------------------------------------------------------------
# VIMSOTTARI DASA VARIATIONS
# ---------------------------------------------------------------------------
dasa_variations:
  description: >
    The dasa can be started not only from the lord of Moon's birth nakshatra
    but also from the lord of the 4th, 5th, or 8th nakshatra from Moon's star.
    The fraction remaining at birth is always computed from Moon's position
    in the birth nakshatra; only the starting planet changes.
  variation_stars:
    - name: "Janma star (birth star)"
      offset_from_moon: 1
      description: "Standard computation from the lord of Moon's own constellation."

    - name: "Kshema star"
      offset_from_moon: 4
      description: "4th constellation from Moon's star."
      usage: "Longevity determination (ayur dasa)"

    - name: "Utpanna star"
      offset_from_moon: 5
      description: "5th constellation from Moon's star."
      usage: >
        General results (phalita dasa). Preferred if the sign containing the
        5th star from Moon is stronger than the sign containing Moon.
      sign_comparison_note: >
        If the 5th star spans 2 signs, take the sign containing the same
        quarter (pada) as occupied by Moon in the birthstar.

    - name: "Adhana star"
      offset_from_moon: 8
      description: "8th constellation from Moon's star."
      usage: "Longevity determination (ayur dasa)"

  longevity_analysis:
    description: >
      For longevity determination, compare signs containing Moon's star,
      4th star (kshema), and 8th star (adhana). Start dasa from the star
      in the strongest of these 3 signs. A sign aspected by marakas and
      malefics becomes stronger for longevity analysis.

  dasa_from_lagna:
    description: >
      Some authorities recommend computing Vimsottari dasa from the
      longitude of lagna instead of Moon. In practice, this gives better
      results only when lagna is considerably more powerful than Moon.

# ---------------------------------------------------------------------------
# INTERPRETATION GUIDELINES
# ---------------------------------------------------------------------------
interpretation:
  general_principles:
    description: >
      Vimsottari dasa is a very general phalita dasa that can also be used
      as an ayur dasa. A planet gives the results promised by its positions
      in various divisional charts during its dasa/antardasa periods.
    examples:
      - "Period of the 5th lord in D-7 can give a child."
      - "Period of the 8th lord in rasi chart can give troubles and frustration."
      - "Period of a planet exalted in GL in D-10 can give power and authority in career."
      - "Period of an exalted planet in the 12th from AK in D-9 can give serious thoughts related to spiritual liberation."
      - "Period of the 7th lord in D-9 can give marriage."
      - "Period of a planet with Rahu in the 9th in D-4 can give foreign residence."
      - "Period of an exalted planet aspecting HL from the 11th from AL in rasi chart can give a lot of wealth."
      - "Period of a planet joined by Moon and Saturn in the 8th house in D-30 may give serious psychological problems and suicidal tendencies."
      - "Period of a well-disposed planet aspecting A3 in D-10 may make one write books."
    dasa_lord_as_lagna: >
      When analyzing antardasas, the dasa lord can be taken as a temporary
      lagna and the chart can be analyzed from that reference point.

  tripod_of_life_principle:
    source: "Rath's Tripod of Life Principle"
    description: >
      Sun, Moon, and lagna form the 'tripod of life'. Parasara advised
      analyzing all charts with respect to positions of Sun, Moon, and lagna
      (Sudarsana chakra).
    reference_points:
      mahadasa:
        reference: Sun
        reason: "Results experienced due to soul (Sun) last long and change slowly."
        note: "Sun is the important reference point in rasi and divisional charts when judging mahadasa results."
      antardasa:
        reference: Moon
        reason: "Results experienced due to mind (Moon) last shorter and change fast."
        note: "Moon is the important reference point when judging antardasa results."
      pratyantardasa:
        reference: Lagna
        reason: "Results experienced due to body (lagna) change even faster."
        note: "Lagna is the important reference point when judging pratyantardasa results."
    yoga_activation:
      - "Ravi yoga (solar combination) gives results in mahadasa of the participating planet."
      - "Chandra yoga (lunar combination) gives results in antardasa of the participating planet."
      - "Other yogas (e.g. Raja Yoga) give results primarily in pratyantardasa of the participating planet."
    additional: >
      Dasa lord can also be taken as a reference point when interpreting antardasas.

  house_lordship_and_placement:
    description: >
      A planet's functional nature is determined by its house lordship and
      placement. Results depend on which houses the planet rules, which
      house it occupies, and what aspects it receives or casts.
    factors:
      - "House lordship determines functional benefic/malefic nature."
      - "Placement in houses (quadrants, trines, dusthanas, upachayas) modifies results."
      - "Aspects received and given by the planet."
      - "Conjunction with other planets."
      - "Position relative to special lagnas (AL, GL, HL, etc.)."
      - "Position in divisional charts (D-7, D-9, D-10, D-30, etc.)."

  yogakaraka_in_dasa:
    description: >
      When a yogakaraka planet's dasa or antardasa runs, it should bring
      favorable results especially related to the houses it rules and the
      yogas it participates in.
    example: >
      Saturn as an exalted yogakaraka from Moon: his antardasa should
      bring gains (Example 55 in the book).

  functional_nature_effects:
    description: >
      Whether a planet is a functional benefic or malefic for a given lagna
      significantly affects the results experienced during its dasa period.
    examples:
      - context: "Functional benefic in quadrant/trine"
        result: "Favorable period, gains and success."
      - context: "8th lord dasa"
        result: "Can bring troubles and frustration."
      - context: "Planet in upachaya from AL"
        result: "Improvement in status."
      - context: "Planet in 8th from AL"
        result: "Fall in status."
      - context: "Debilitated planet in 12th house"
        result: "Losses, setbacks."

  maraka_dasa_rules:
    description: >
      Rules for determining which dasa periods can cause death. Used when
      Vimsottari dasa is applied as an ayur dasa (longevity dasa).
    maraka_houses:
      - house: 2
        role: "Primary maraka (killer) house. Parasara emphasized the 2nd house as particularly a maraka."
      - house: 7
        role: "Secondary maraka house."
    life_houses:
      - house: 3
        role: "House of life"
      - house: 8
        role: "House of life"
    maraka_planets:
      - "Lords of the 2nd and 7th houses."
      - "Occupants of the 2nd and 7th houses."
      - "Malefics in the 2nd house are strong marakas."
      - "Planet owning 8th and occupying 7th is a very strong maraka."
      - "3rd lord in 7th house is also a maraka."
      - "Planet in mrityu bhaga (death degree) gains killing power."
    special_roles:
      maheswara: "The 8th lord from Atmakaraka (AK). Acts as a strong maraka."
      rudra: "Planet joined with Maheswara also has maraka potential."
    longevity_dasa_variation: >
      For longevity analysis, compare signs of Moon's star, 4th star, and
      8th star. The sign aspected by marakas and malefics is strongest.
      Start Vimsottari dasa from the star in the strongest sign and use
      that variation for death timing.
    examples:
      - name: "JFK Jr."
        dasa: "Saturn-Mercury antardasa"
        details: >
          Mercury (2nd lord in mrityu bhaga in 3rd house) is strong maraka.
          Saturn (7th lord, Maheswara as 8th lord from AK Mars, joined Rudra Jupiter)
          is also a strong maraka. Death occurred in Saturn-Mercury AD.
      - name: "Lady who committed suicide"
        dasa: "Jupiter-Venus antardasa"
        details: >
          Jupiter is 7th lord (exalted, very strong maraka). Venus is 2nd lord
          in 2nd house. Dasa started from 4th star (kshema) because the sign of
          the 4th star was strongest (aspected by both marakas Jupiter and Venus).
      - name: "Dr. B.V. Raman"
        dasa: "Mercury-Rahu antardasa (from 8th star variation)"
        details: >
          Mercury owns 8th and occupies 7th (strongest maraka). Rahu in 2nd
          house is also a maraka. Using the 8th star (adhana) variation, Mercury-Rahu
          AD was running at death in December 1998.

# ---------------------------------------------------------------------------
# SPECIAL NOTES AND CAVEATS
# ---------------------------------------------------------------------------
special_notes:
  kendradi_graha_dasa: >
    If all the quadrants from the stronger of lagna and Moon are occupied
    by planets, 'Kendradi Graha Dasa' is more appropriate than Vimsottari
    dasa. Results from Vimsottari dasa may not be very good in such cases.

  birthtime_error_sensitivity:
    formula: "Error in dasa dates (days) = approximately (m * n) / 4"
    variables:
      m: "Error in birthtime (minutes)"
      n: "Complete duration of the first dasa (years)"
    example: "If first dasa is Venus (n=20), an error of 5 minutes in birthtime results in approximately 5*20/4 = 25 days error in dasa dates."
    implication: >
      Low-level sub-periods like sookshma dasas cannot be used confidently
      unless the birthtime is rectified. It is a good idea to allow a margin
      of error when examining dasa start/end dates.

  divisional_chart_usage:
    description: >
      Each planet gives results indicated by its placement in divisional charts.
      The relevant divisional chart depends on the area of life being examined.
    chart_applications:
      D-7: "Progeny (children)"
      D-9: "Marriage, dharma, spiritual liberation"
      D-10: "Career, achievements in society (dasamsa)"
      D-30: "Psychological issues, misfortunes"
      D-4: "Property, residence (foreign or domestic)"
      Rasi: "General life events, status, health"

  pratyantardasa_significance: >
    The pratyantardasa running at the time of an event usually belongs to the
    most important planet influencing the house of interest in the divisional
    chart of interest.
