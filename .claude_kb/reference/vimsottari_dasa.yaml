# Vimsottari Dasa Reference
# Source: Vedic Astrology - An Integrated Approach by P.V.R. Narasimha Rao
# Chapter 16, Book pages 181-194 (PDF pages 188-201)

source:
  book: "Vedic Astrology: An Integrated Approach"
  author: "P.V.R. Narasimha Rao"
  chapter: 16
  chapter_title: "Vimsottari Dasa"
  book_pages: "181-194"
  pdf_pages: "188-201"
  table_reference: "Table 38: Vimsottari Dasa Lengths"

# ---------------------------------------------------------------------------
# OVERVIEW
# ---------------------------------------------------------------------------
overview:
  meaning: "Vimsottari means 120. Total dasa cycle spans 120 years."
  significance: >
    Most popular dasa system among Vedic astrologers of today. Sage Parasara
    mentions in Brihat Parasara Hora Sastram that this dasa system is the most
    suitable dasa system in Kali yuga, because paramaayush (maximum longevity)
    of human beings in Kali yuga is supposed to be 120 years.
  basis: "Constellation (nakshatra) occupied by Moon at birth"
  total_years: 120
  type: "Nakshatra-based dasa (constellation-based)"
  usage:
    - "Phalita dasa (general predictive results)"
    - "Ayur dasa (longevity determination)"

# ---------------------------------------------------------------------------
# DASA PERIOD HIERARCHY (terminology)
# ---------------------------------------------------------------------------
period_hierarchy:
  - level: 1
    name: "Mahadasa (MD)"
    meaning: "Master period"
    also_called: "Dasa"
  - level: 2
    name: "Antardasa (AD)"
    meaning: "Sub-period within mahadasa"
  - level: 3
    name: "Pratyantardasa (PD)"
    meaning: "Sub-sub-period within antardasa"
  - level: 4
    name: "Sookshma Dasa (SD)"
    meaning: "Sub-period within pratyantardasa"
    also_called: "Sookshma-antardasa"
  - level: 5
    name: "Prana Dasa (PAD)"
    meaning: "Sub-period within sookshma dasa"
    also_called: "Prana-antardasa"
  - level: 6
    name: "Deha Dasa (DAD)"
    meaning: "Sub-period within prana dasa"
    also_called: "Deha-antardasa"

# ---------------------------------------------------------------------------
# DASA SEQUENCE AND LENGTHS (Table 38)
# ---------------------------------------------------------------------------
# The order below is the fixed cyclic sequence.
# The first dasa planet is determined by Moon's nakshatra lord at birth.
# Subsequent dasas follow this cyclic order.
dasa_sequence:
  - planet: Sun
    years: 6
  - planet: Moon
    years: 10
  - planet: Mars
    years: 7
  - planet: Rahu
    years: 18
  - planet: Jupiter
    years: 16
  - planet: Saturn
    years: 19
  - planet: Mercury
    years: 17
  - planet: Ketu
    years: 7
  - planet: Venus
    years: 20

total_years_check: 120  # 6+10+7+18+16+19+17+7+20 = 120

