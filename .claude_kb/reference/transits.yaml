    # Table 69: Body Parts in the Transit of Saturn, Rahu and Ketu
    table_69_saturn_rahu_ketu:
      table_number: 69
      title: "Body Parts in the Transit of Saturn, Rahu and Ketu"
      entries:
        - { nakshatras: "1st",                                           body_part: "Face",          result: "Grief" }
        - { nakshatras: "2nd, 3rd, 4th, 5th",                           body_part: "Right hand",    result: "Comforts" }
        - { nakshatras: "6th, 7th, 8th",                                body_part: "Right leg",     result: "Travels" }
        - { nakshatras: "9th, 10th, 11th",                              body_part: "Left leg",      result: "Destruction" }
