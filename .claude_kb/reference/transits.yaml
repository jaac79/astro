# =============================================================================
# CHAPTER 25: TRANSITS AND NATAL REFERENCES
# =============================================================================

chapter_25:
  title: "Transits and Natal References"

  # ---------------------------------------------------------------------------
  # 25.1 Introduction
  # ---------------------------------------------------------------------------
  introduction:
    definitions:
      transit: >
        By transits or gochaara, we mean the motion of planets in the skies.
        The transit or chaara or gochaara position of a planet is the position
        occupied by a planet at a given time.
      natal: >
        The natal or radical or birth or janma position of a planet is the
        position occupied by a planet at the time of one's birth.
    principle: >
      By correlating the transit positions on a given day with the natal
      positions of several reference points, we can draw conclusions about
      the nature of results experienced by the native then.

  # ---------------------------------------------------------------------------
  # 25.2 Transits from Moon (Janma Rasi)
  # ---------------------------------------------------------------------------
  transits_from_moon:
    description: >
      The most popular natal reference in transit analysis is Moon. Moon is
      the significator of mind. Analysis of planetary positions with respect
      to Moon shows the mental state. The rasi occupied by Moon in the natal
      chart is called janma rasi. The transit of Vimsottari dasa lord is
      particularly important.
    note: >
      These results are given only for reference. In reality, not everyone
      with the same janma rasi experiences the same results on a given day.
      The results given by planets depend on what they stand for in the
      natal chart. For example, if Mars is the 5th lord, worries during his
      8th house transit may pertain to children. If Mars is the 10th lord,
      they may pertain to career.

    # Table 53: Sun's Transit from Janma Rasi
    sun_transit:
      table_number: 53
      title: "Sun's Transit from Janma Rasi"
      results:
        1st:  { snapshot: "Bad",  result: "Financial loss, many travels, discomfort" }
