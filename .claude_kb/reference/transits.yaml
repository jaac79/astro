  # ---------------------------------------------------------------------------
  # 25.3 Other Natal References
  # ---------------------------------------------------------------------------
  other_natal_references:
    lagna:
      description: >
        Lagna is the hub of vitality and one's personality in a chart.
        Using ashtakavarga tables, we can decipher whether the transit
        of a planet in a house from lagna is favorable or not. A planet
        occupying or aspecting a rasi in transit influences the matters
        signified by the houses and planets stationed in that rasi in
        the natal chart.
      examples:
        - "Jupiter transiting in Ta may give marriage to someone born in Sc lagna (Ta is 7th from Sc)"
        - "Saturn transiting in Ar may give relationship problems for someone born in Li lagna (Ar is 7th from Li)"

    paaka_lagna:
      description: >
        Paaka lagna explicitly stands for the physical self. A malefic
        planet transiting in paaka lagna may give bodily complaints.

    arudha_padas:
      description: >
        Planets occupying or aspecting arudha padas in transit may give
        relevant results.
      examples:
        - "Saturn's transit in A10 can be bad for career"
        - "Jupiter's transit in A9 is good for fortune"

    sahams:
      description: >
        Sahams are significant points in the zodiac useful in transit analysis.
      examples:
        - "When the 7th lord or Venus transits close to vivaha saham, one may get married"
        - "When the 6th lord or 8th lord or Mars or Rahu transits close to kali saham, one may have an accident"

    transit_aspects:
      description: >
        We should look at the aspects cast by transiting planets on the
        rasis containing natal houses and natal planets. Jupiter transiting
        in Vi aspects Ta (via rasi aspect). So Jupiter can influence the
        7th house of someone with Sc lagna during his Vi transit also.

    general_principle: >
      A planet occupying or aspecting a rasi in transit influences the
      matters signified by the houses and planets stationed in that rasi
      in the natal chart. The exact nature of influence depends on the
      planet's inherent nature and the matters it stands for in the natal chart.

    malefic_transit_effects:
      janma_rasi: "Mental worries"
      natal_lagna: "Affects vitality, creates obstacles in efforts"
      paaka_lagna: "Bodily complaints"

  # ---------------------------------------------------------------------------
  # 25.4 Transits and Divisional Charts
  # ---------------------------------------------------------------------------
  transits_and_divisional_charts:
    description: >
      This approach correlates transit positions in divisional charts with
      natal positions. The author notes this is based on his own researches
      and is related to the tradition of Bhrigu transits, which correlate
      transit positions in navamsa chart with natal positions in rasi chart.

    key_principle: >
      We do not have different zodiacs for different divisional charts.
      All the divisional charts use the same zodiac. So Cancer in natal
      navamsa chart and Cancer in transit rasi chart are one and the same.
      If Jupiter transiting in Cancer can influence the house and planets
      stationed in Cancer in rasi chart, he should be able to influence
      the house and planets stationed in Cancer in navamsa chart too.

    two_important_interactions:
      interaction_1:
        description: "Natal divisional chart + Transit rasi chart"
        shows: >
          How innate potential in a particular area of life is influenced
          at a given time to result in action at the physical level.
          Helps in coarse timing of events.
      interaction_2:
        description: "Natal rasi chart + Transit divisional chart"
        shows: >
          How the potential at the physical level is transformed into
          an event in a particular area of life. Helps in fine-tuning
          the timing of events.

    divisional_chart_applications:
      D-7: "Children and happiness from them - 5th house shows children"
      D-9: "Marriage - 7th house and 9th lord (dharma)"
      D-10: "Career and profession"
      D-11: "Death and destruction (Rudramsa)"
      D-4: "Residence and fortune (property)"
      D-24: "Knowledge and learning"
      D-12: "Parents"

    examples:
      - number: 105
        description: >
          Wedding timing: In natal navamsa, Pi contains 7th house. At wedding,
          Venus (significator of marriage and 9th lord in navamsa) occupied Aq,
          which is 7th lord Jupiter's natal navamsa position. Jupiter was in
          own sign Pi in transit (the 7th house in natal navamsa).
      - number: 106
        description: >
          Child birth: In natal D-7, 5th house is Vi with Jupiter and Mercury.
          At time of child-birth, both Jupiter and Mercury were in Vi in transit
          rasi chart, activating the 5th house of D-7.
      - number: 107
        description: >
          Death of JFK Jr: D-11 (Rudramsa) shows death and destruction.
          Planets of life (Mercury, Sun) in transit occupied 2nd house (death)
          in natal D-11. Saturn debilitated. Houses and planets of life in
          D-11 afflicted or weak in transit rasi chart.

  # ---------------------------------------------------------------------------
  # 25.5 Transits and Ashtakavarga
  # ---------------------------------------------------------------------------
  transits_and_ashtakavarga:
    description: >
      The most important purpose of ashtakavarga is the interpretation of
      transits. We look at the houses occupied by a transit planet with
      respect to all eight references used in ashtakavarga.

    bav_transit_rules:
      favorable: "If a planet has 5 or more rekhas in its transit rasi in its BAV, it produces good results"
      unfavorable: "If a planet has 3 or less rekhas in its transit rasi in its BAV, it produces bad results"
      excellent: "A planet with 6 or 7 rekhas invariably brings excellent results"
      very_poor: "A planet with 1 or 0 rekhas invariably brings very poor results"

    divisional_chart_extension: >
      The same logic can be extended to divisional charts. If Jupiter has
      8 rekhas in Ar in natal D-10 chart, then his transit in Aries in
      rasi chart invariably brings excellent results in career.

    # 25.5.1 Samudaaya Ashtakavarga
    samudaaya_ashtakavarga:
      section: "25.5.1"
      description: >
        In addition to individual BAVs, we should look at the natal SAV.
        SAV will dominate over individual BAVs if it has too many or too
        few rekhas.
      rules:
        favorable: "Planets transiting in rasis with more than 30 rekhas in SAV usually bring favorable results"
        unfavorable: "Planets transiting in rasis with less than 25 rekhas in SAV usually bring unfavorable results"
      note: >
        If SAV has 40 bindus in Pisces, it means Pisces is very strong.
        Planets transiting in Pisces tend to give good results irrespective
        of their individual strength.

    example_vajpayee_d10_ashtakavarga:
      title: "Example 108: Sri A.B. Vajpayee D-10 Ashtakavarga"
      table_number: "Vajpayee D-10 BAV"
      data:
        Sun:  { Ar: 5, Ta: 3, Ge: 6, Cn: 2, Le: 3, Vi: 4, Li: 7, Sc: 6, Sg: 3, Cp: 3, Aq: 2, Pi: 4 }
        Moon: { Ar: 2, Ta: 4, Ge: 2, Cn: 3, Le: 6, Vi: 6, Li: 4, Sc: 4, Sg: 4, Cp: 6, Aq: 3, Pi: 5 }
        Mars: { Ar: 3, Ta: 4, Ge: 4, Cn: 3, Le: 4, Vi: 2, Li: 2, Sc: 5, Sg: 3, Cp: 4, Aq: 1, Pi: 4 }
        Mercury: { Ar: 4, Ta: 4, Ge: 6, Cn: 4, Le: 6, Vi: 5, Li: 3, Sc: 6, Sg: 4, Cp: 5, Aq: 4, Pi: 3 }
        Jupiter: { Ar: 4, Ta: 6, Ge: 4, Cn: 2, Le: 3, Vi: 8, Li: 3, Sc: 6, Sg: 4, Cp: 3, Aq: 7, Pi: 6 }
        Venus: { Ar: 2, Ta: 4, Ge: 6, Cn: 4, Le: 3, Vi: 5, Li: 3, Sc: 5, Sg: 5, Cp: 6, Aq: 5, Pi: 4 }
        Saturn: { Ar: 3, Ta: 1, Ge: 5, Cn: 2, Le: 3, Vi: 3, Li: 4, Sc: 3, Sg: 5, Cp: 4, Aq: 2, Pi: 4 }
        SAV: { Ar: 23, Ta: 26, Ge: 33, Cn: 20, Le: 28, Vi: 33, Li: 26, Sc: 35, Sg: 28, Cp: 31, Aq: 24, Pi: 30 }

    # 25.5.2 Kakshyas and Prastaara Ashtakavarga
    kakshyas:
      section: "25.5.2"
      description: >
        Each rasi is divided into eight kakshyas of 3 degrees 45 minutes each.
        Kakshya literally means orbit. When a planet is in a particular
        kakshya lord's kakshya, its placement with respect to that lord
        is the most important.

      table_60_kakshyas:
        table_number: 60
        title: "Kakshyas"
        divisions:
          - { start: "0:00",  end: "3:45",  lord: "Saturn" }
          - { start: "3:45",  end: "7:30",  lord: "Jupiter" }
          - { start: "7:30",  end: "11:15", lord: "Mars" }
          - { start: "11:15", end: "15:00", lord: "Sun" }
          - { start: "15:00", end: "18:45", lord: "Venus" }
          - { start: "18:45", end: "22:30", lord: "Mercury" }
          - { start: "22:30", end: "26:15", lord: "Moon" }
          - { start: "26:15", end: "30:00", lord: "Lagna" }

      pav_principle: >
        To find out whether a planet is benefic with respect to a kakshya
        lord in a rasi, look at the Prastaara Ashtakavarga (PAV). A kakshya
        has a rekha in a planet's PAV if that planet is benefic in that rasi
        with respect to the kakshya lord.

      favorable_days_method: >
        A popular method of delineating favorable and unfavorable days is to
        look at the number of planets that are in a kakshya with a rekha.
        If too many planets are in a kakshya with a rekha, favorable results.
        If too few, unfavorable results. This should be used only in
        conjunction with dasas, Tajaka charts and other transit techniques.
        Can only fine-tune a prediction to a few days.

      example_indira_gandhi:
        number: 110
        description: >
          At Indira Gandhi's assassination: Sun in Sun's kakshya, Moon in
          Sun's kakshya, Mars in Moon's kakshya, Mercury in lagna's kakshya,
          Jupiter in Venus's kakshya, Venus in Mercury's kakshya, Saturn in
          Moon's kakshya. Only Moon and Mercury were in kakshyas with rekhas.
          With 5 out of 7 planets transiting in kakshyas without rekhas
          (including Vimsottari dasa lord Saturn), not a favorable time.

  # ---------------------------------------------------------------------------
  # 25.6 Timing with Sodhya Pindas
  # ---------------------------------------------------------------------------
  timing_with_sodhya_pindas:
    section: "25.6"
    description: >
      Parasara taught techniques of timing events based on sodhya pindas.
      Take the number of rekhas in any house from a planet, multiply by
      the planet's sodhya pinda (also called yoga pinda).

    method:
      step_1: "Fix the relevant planet for the matter of interest"
      step_2: "Fix the relevant house from that planet"
      step_3: "Find the number of rekhas in that house in the planet's BAV"
      step_4: "Multiply rekhas by the planet's sodhya pinda (yoga pinda)"
      nakshatra_method: >
        Divide the product by 27, take the remainder, count nakshatras
        from Aswini. Benefics transiting in that nakshatra give good results;
        malefics give bad results. The 10th and 19th nakshatras from the
        result also apply (same Vimsottari lord).
      rasi_method: >
        Divide the product by 12, take the remainder, count rasis from
        Aries. Saturn's transit in the resultant rasi brings misfortune
        for the original house matters.

    planet_significations_in_houses:
      Sun: "Soul, inherent nature, personality, will power, father"
      Moon: "Mind, wisdom, peace, happiness, mother"
      Mars: "Siblings, land, strength"
      Mercury: "Business, commerce, profession, friends, good behavior"
      Jupiter: "Nourishment of body, learning, children, wealth"
      Venus: "Marriage, comforts, luxuries, vehicles, sexual pleasures"
      Saturn: "Longevity, livelihood, fears, sadness, dangers, sorrows"

    table_61_timing_areas:
      table_number: 61
      title: "Timing with Sodhya Pinda"
      entries:
        - { planet: "Sun",     house: "9th",  area: "Father" }
        - { planet: "Moon",    house: "4th",  area: "Mother" }
        - { planet: "Mars",    house: "3rd",  area: "Siblings" }
        - { planet: "Mercury", house: "10th", area: "Profession" }
        - { planet: "Jupiter", house: "5th",  area: "Children" }
        - { planet: "Venus",   house: "7th",  area: "Marriage" }
        - { planet: "Saturn",  house: "8th",  area: "Longevity" }

    examples:
      - number: 111
        name: "Princess Diana"
        description: >
          To see longevity: 8th house from Saturn is Le. Le has 0 rekhas
          in Saturn's BAV. Saturn's sodhya pinda is 203. Product is 0.
          0 / 27 remainder = 27 = Revathi star. 0 / 12 remainder = 12 = Pisces.
          When Saturn was transiting in Revathi star in Pisces, she passed away.
        saturn_bav: { Ar: 3, Ta: 4, Ge: 6, Cn: 3, Le: 0, Vi: 2, Li: 2, Sc: 5, Sg: 4, Cp: 3, Aq: 2, Pi: 5 }

      - number: 112
        name: "Bill Gates - Legal Setback"
        description: >
          Moon in Pisces, Pisces has 6 rekhas in Moon's BAV. Moon's sodhya
          pinda is 122. Product = 732. 732 / 27 remainder = 3 = Krittika star.
          Saturn's transit in Krittika attacks the 1st house from Moon.
          Also: 6th from Saturn is Pi, 3 rekhas in Saturn's BAV. Saturn's
          sodhya pinda is 145. Product = 435. 435 / 27 remainder = 3 = Krittika.
          Saturn's transit in Krittika brings sadness and setbacks in litigation.
        moon_bav: { Ar: 4, Ta: 3, Ge: 4, Cn: 4, Le: 6, Vi: 3, Li: 1, Sc: 5, Sg: 5, Cp: 4, Aq: 4, Pi: 6 }
        saturn_bav: { Ar: 3, Ta: 3, Ge: 4, Cn: 4, Le: 7, Vi: 2, Li: 1, Sc: 3, Sg: 2, Cp: 4, Aq: 3, Pi: 3 }

    research_note: >
      This approach does not give consistent results. The topic of sodhya
      pindas is open to research. Issues include: Should we use divisional
      charts (e.g. D-12 for father)? Should we use sodhya pinda and rekha
      count from the divisional chart? Inconsistencies between Parasara
      and Varahamihira in ashtakavarga definitions can alter sodhya pindas.
      Controversies in exact definitions of reductions from Bhinna to
      Sodhita Ashtakavarga can also alter sodhya pindas.

  # ---------------------------------------------------------------------------
  # 25.7 Conclusion
  # ---------------------------------------------------------------------------
  conclusion: >
    Transit positions of planets are the positions occupied by them at a given
    time. Natal positions stand for the innate potential. Transit positions show
    the temporary influences (planetary pulls and pushes). The interaction
    between natal divisional charts and transit rasi chart helps in coarse
    timing of events. The interaction between natal rasi chart and transit
    divisional charts helps in fine timing of events.

