    usage_note: >
      If a planet dwells in the left hand in transit and some natural malefics
      aspect it or cause vedha on it, then the planet may give suffering
      related to the left hand. Some injuries to the left hand are possible.

  # ---------------------------------------------------------------------------
  # 26.7 Latta (Kick)
  # ---------------------------------------------------------------------------
  latta:
    section: "26.7"
    title: "Latta (Kick)"
    description: >
      Latta is a nakshatra-based planetary kick. Each planet has latta (kick)
      on a constellation based on its transit position. If a transit planet
      has latta on the constellation occupied by Moon (or lagna) in natal
      chart, unfavorable results related to the signification of the planet
      in natal chart may be expected.

    purolatta_forward_kick:
      description: "Forward kick - counted in the forward direction from transit nakshatra"
      planets:
        - { planet: "Sun",     count: "12th nakshatra forward", example: "Sun in Mrigasira has latta on Visakha" }
        - { planet: "Mars",    count: "3rd nakshatra forward",  example: "Mars in Mrigasira has latta on Punarvasu" }
        - { planet: "Jupiter", count: "6th nakshatra forward",  example: "Jupiter in Krittika has latta on Pushyami" }
        - { planet: "Saturn",  count: "8th nakshatra forward",  example: "Saturn in Krittika has latta on Makha" }

    prishtha_latta_backward_kick:
      description: "Backward kick - counted in the backward direction from transit nakshatra"
      planets:
        - { planet: "Moon",    count: "22nd nakshatra backward", example: "Moon in Anuradha has latta on Dhanishtha" }
        - { planet: "Mercury", count: "7th nakshatra backward",  example: "Mercury in Punarvasu has latta on Aswini" }
        - { planet: "Venus",   count: "5th nakshatra backward",  example: "Venus in Mrigasira has latta on Aswini" }
        - { planet: "Rahu",    count: "9th nakshatra backward",  example: "Rahu in Punarvasu has latta on Uttarabhadrapada" }

    latta_summary:
      Sun:     { direction: "Forward",  count: 12 }
      Mars:    { direction: "Forward",  count: 3 }
      Jupiter: { direction: "Forward",  count: 6 }
      Saturn:  { direction: "Forward",  count: 8 }
      Moon:    { direction: "Backward", count: 22 }
      Mercury: { direction: "Backward", count: 7 }
      Venus:   { direction: "Backward", count: 5 }
      Rahu:    { direction: "Backward", count: 9 }

    interpretation: >
      If the 6th lord has latta on janma nakshatra or lagna nakshatra,
      troubles related to litigation, disease or enemies. If the 7th lord
      has latta, troubles related to marriage, spouse or relations. If an
      important planet in the 10th house has latta, troubles in career.
      We usually see some loss related to the natal significations of a
      planet having latta on janma nakshatra or lagna nakshatra.

    note: "Latta on janma nakshatra is more important than on lagna nakshatra."

    table_70_example:
      table_number: 70
      title: "Latta Calculation for Example 113"
      description: "Janma nakshatra: Poorvabhadrapada, Lagna nakshatra: Hasta"
      entries:
        - { planet: "Sun",     transit_nakshatra: "Jyeshtha",           latta_count: "12th", direction: "Forward",  latta_on: "Bharani" }
        - { planet: "Moon",    transit_nakshatra: "Hasta",              latta_count: "22nd", direction: "Backward", latta_on: "Moola" }
        - { planet: "Mars",    transit_nakshatra: "Poorva Phalguni",    latta_count: "3rd",  direction: "Forward",  latta_on: "Hasta" }
        - { planet: "Mercury", transit_nakshatra: "Moola",              latta_count: "7th",  direction: "Backward", latta_on: "Hasta" }
        - { planet: "Jupiter", transit_nakshatra: "Poorvaashaadha",     latta_count: "6th",  direction: "Forward",  latta_on: "Poorvabhadrapada" }
        - { planet: "Venus",   transit_nakshatra: "Visaakha",           latta_count: "5th",  direction: "Backward", latta_on: "Uttaraphalguni" }
        - { planet: "Saturn",  transit_nakshatra: "Uttarabhadrapada",   latta_count: "8th",  direction: "Forward",  latta_on: "Aardra" }
        - { planet: "Rahu",    transit_nakshatra: "Hasta",              latta_count: "9th",  direction: "Backward", latta_on: "Mrigasira" }
      analysis: >
        Two lattas on lagna nakshatra (Hasta) by 8th lord Mars and lagna
        lord Mercury. Bad results relating to 1st and 8th houses possible
        (accidents). Jupiter has latta on janma nakshatra (Poorvabhadrapada);
        Jupiter owns 4th and 7th houses. Misfortune related to vehicle,
        house or marital life possible. Native had a vehicular accident on
        evening of 5th December 1996.

  # ---------------------------------------------------------------------------
  # 26.8 Sarvatobhadra Chakra
  # ---------------------------------------------------------------------------
  sarvatobhadra_chakra:
    section: "26.8"
    title: "Sarvatobhadra Chakra"
    definition: >
      Sarvatah means "everywhere" or "entirely". Bhadra means "auspicious"
      or "well". Sarvatobhadra chakra is a chart that shows all-round
      well-being and all kinds of auspicious and inauspicious results.

    structure:
      total_squares: 81
      layout: "9 x 9 grid"
      contents:
        border_squares: "Middle 7 squares on outer borders contain 7 nakshatras each (28 total, including Abhijit)"
        inner_squares: "Innermost 5 squares contain weekdays and tithis"
        diagonal_squares: "All squares on diagonals (except central) contain vowels (16 total)"
        consonant_squares: "Squares just inside the border contain consonants (20 total)"
        rasi_squares: "12 rasis are included"
      total_breakdown: "16 vowels + 20 consonants + 12 rasis + 28 nakshatras + 5 tithis/weekdays = 81"

    tithis:
      nanda:  "1st, 6th, 11th, 16th, 21st, 26th tithis"
      bhadra: "2nd, 7th, 12th, 17th, 22nd, 27th tithis"
      jaya:   "3rd, 8th, 13th, 18th, 23rd, 28th tithis"
      rikta:  "4th, 9th, 14th, 19th, 24th, 29th tithis"
      poorna: "5th, 10th, 15th, 20th, 30th tithis"

    vedha_mechanism: >
      When a planet occupies a nakshatra, it causes vedha (obstruction)
      on the contents of the squares along 3 lines: one vertical or
      horizontal line and two crossward (diagonal) lines starting at
      the nakshatra.

    special_principles:
      - >
        A planet in the first quarter of Krittika or the last quarter of
        Bharani has vedha on the vowel "a" in the northeastern corner.
        Similar thing applies to all vowels in corners.
      - >
        If a vowel has vedha, its similar vowel (e.g. a and aa, i and ee,
        u and uu) also has vedha from the same planet.
      - >
        Some consonants are not covered in the main chart. Planets in Ardra
        have vedha on g, chh and ng (nasal). Planets in Hasta have vedha
        on h, n (alveolar) and th (alveolar). Planets in Poorvashadha have
        vedha on dh (dental), ph and dh (alveolar). Planets in Uttara
        Bhadrapada have vedha on th (dental), jh and nch (nasal).
      - >
        If a planet has vedha on one of the following pairs of consonants,
        it has vedha on the other too: b & v; s & sh (palatal); kh & sh
        (alveolar); j & y; ng & tr.

    using_sarvatobhadra_chakra:
      natal_references:
        - "The constellation occupied by Moon or any special tara"
        - "The rasi occupied by lagna or any house of interest"
        - "The first/prominent consonant and vowel in the native's name"
        - "The tithi of birth (janma tithi) or a special tithi"
        - "The weekday of birth (janma vaara)"
      transit_analysis: >
        Study the vedha caused on these natal references by different
        planets in their transit. Vedha by benefics (Moon, Mercury,
        Jupiter, Venus) is favorable. Vedha by malefics (Sun, Mars,
        Saturn, Rahu, Ketu) is unfavorable. If several transiting benefics
        have simultaneous vedha on several natal points, good results
        may be expected.

    special_tithis:
      description: >
        In addition to janma tithi, we can consider special tithis related
        to the matter of interest.
      karma_tithi:
        description: "Lunar day of profession"
        formula: >
          Multiply (Moon longitude - Sun longitude) by 10, reduce to 0-360
          range, divide by 12, add 1 to quotient. Gives a number 1-30.
          Changes 10 times as fast as normal tithi.
      dhana_tithi:
        description: "Lunar day of wealth"
        note: "Changes twice as fast as normal tithi"

    prediction_principle: >
      If 2-3 natal references have vedha from a couple of benefic/malefic
      transit planets, we can be more confident. However, a prediction
      should be made only if dasas and Tajaka charts also show an event.
      Just one natal reference with vedha from just one planet is
      insufficient for predictions.

    examples:
      - number: 115
        title: "Death of JFK Jr."
        description: >
          Janma tithi: Sukla Ashtami (Jaya group). Janma vaara: Thursday.
          Janma nakshatra: Dhanishtha. Vainasika nakshatra: Anooradha.
          Naidhana nakshatra: Bharani.
          In transit: Saturn in Bharani (naidhana nakshatra). Ketu in
          Sravanam. Crossward lines from Ketu and Saturn intersect at
          Jaya and Thursday (janma tithi and janma vaara have vedha from
          Ketu and Saturn). Dhanishtha (janma nakshatra) has vedha from
          Ketu and Rahu. Anooradha (vainaasika nakshatra) has vedha from
          Saturn and Rahu. Cp (house of accidents) has vedha from Ketu and Mars.

      - number: 116
        title: "Rajiv Gandhi's ascension to power (Oct 31, 1984)"
        description: >
          Jupiter and Mercury both have vedha on Nanda (tithi group) and
          Sunday (janma vaara). The tithi of power (5th) is Sukla Shashthi
          (Nanda group). Mercury and Moon both have vedha on Dhanishtha
          (abhisheka nakshatra). Jupiter and Venus both have vedha on Sg
          (5th house of power). Mercury and Venus both have vedha on Libra
          (contains GL). Several key natal references have vedha from two
          benefic planets each.

      - number: 117
        title: "Rajiv Gandhi's defeat (Nov 22, 1989)"
        description: >
          When he became PM in 1984, Jupiter was in Poorvashadha (karma
          nakshatra). At defeat in 1989, Saturn was in that constellation.
          Nanda and Sunday have vedha from 3 malefics. Dhanishtha
          (Abhisheka nakshatra) occupied by Rahu with vedha from Ketu.
          5th house Sg has vedha from Mars and Saturn.

  # ---------------------------------------------------------------------------
  # 26.9 Conclusion
  # ---------------------------------------------------------------------------
  conclusion: >
    Several important topics related to transits in nakshatras were covered.
    One should carefully learn and practice all these classical nakshatra-based
    techniques. However, new students should not make predictions just based
    on these techniques. Any technique that divides people into 27 groups
    and gives the same result for everyone in the same group can be correct
    only to a limited extent. These methods should be used in conjunction
    with other chart-sensitive methods.

# =============================================================================
# KEY TRANSIT PRINCIPLES SUMMARY
# =============================================================================

transit_principles_summary:
  primary_natal_reference: "Moon (janma rasi) - shows mental state"
  other_natal_references:
    - "Lagna - vitality and personality"
    - "Paaka Lagna - physical self"
    - "Arudha Lagna and Arudha Padas - worldly perception"
    - "Sahams - specific life events"

  transit_analysis_layers:
    layer_1: "Transit from Moon (janma rasi) - basic good/bad assessment"
    layer_2: "Vedha check - obstruction from other transiting planets"
    layer_3: "Murthi check - golden/silver/copper/iron form based on Moon at rasi entry"
    layer_4: "Ashtakavarga - BAV rekhas and SAV bindus for strength assessment"
    layer_5: "Kakshya - fine-tuning within each rasi (3 deg 45 min divisions)"
    layer_6: "Tara - nakshatra-based assessment (good/bad stars)"
    layer_7: "Special nakshatras - karma, naidhana, abhisheka, etc."
    layer_8: "Latta - planetary kicks on janma/lagna nakshatras"
    layer_9: "Sarvatobhadra Chakra - comprehensive vedha analysis"
    layer_10: "Divisional chart transits - coarse and fine timing of events"
    layer_11: "Sodhya pindas - timing with ashtakavarga products"

  timing_hierarchy:
    coarse: "Natal divisional chart + Transit rasi chart"
    fine: "Natal rasi chart + Transit divisional chart"
    fine_tuning: "Kakshya-based analysis for prediction to specific days"

  important_caveats:
    - "No single technique should be used in isolation for predictions"
    - "Dasas and Tajaka charts should also support any prediction"
    - "Techniques dividing people into 27 groups (nakshatra-based) are limited"
    - "Results depend on what each planet stands for in the individual natal chart"
    - "Sodhya pinda timing is an area open to further research"
