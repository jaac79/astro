# CHAPTER 26: TRANSITS - MISCELLANEOUS TOPICS
# =============================================================================

chapter_26:
  title: "Transits: Miscellaneous Topics"

  # ---------------------------------------------------------------------------
  # 26.1 Introduction
  # ---------------------------------------------------------------------------
  introduction: >
    In Chapter 25, we concentrated on correlating the natal chart and the
    transit chart using the rasis occupied by planets. There are additional
    principles about rasi transits and nakshatra-based transit interactions
    covered in this chapter.

  # ---------------------------------------------------------------------------
  # 26.2 Murthis (Forms/Idols) - Moorti Nirnaya
  # ---------------------------------------------------------------------------
  murthis:
    section: "26.2"
    title: "Murthis (Forms/Idols)"
    description: >
      To judge the results given by a planet during its transit in a
      particular rasi, find exactly when the planet enters the rasi.
      Find the house occupied by transit Moon at that time with respect
      to Moon's natal position. Based on the house, the planet is said
      to be in a golden, silver, copper or iron form during that transit.

    table_62_murthis:
      table_number: 62
      title: "Murthis"
      classifications:
        swarna:
          houses: [1, 6, 11]
          name: "Swarna"
          meaning: "Golden form"
          results: "Highly favorable"
        rajata:
          houses: [2, 5, 9]
          name: "Rajata"
          meaning: "Silver form"
          results: "Favorable"
        taamra:
          houses: [3, 7, 10]
          name: "Taamra"
          meaning: "Copper form"
          results: "Unfavorable"
        loha:
          houses: [4, 8, 12]
          name: "Loha"
          meaning: "Iron form"
          results: "Highly unfavorable"

    usage_note: >
      Even if a transit is favorable otherwise, a loha murthi (iron form)
      planet may not give its full results. If the transit is unfavorable
      otherwise, the planet will make the native suffer much. It is
      important to consider vedhas and murthis to understand why a planet
      expected to produce brilliant results gives only marginal results.

  # ---------------------------------------------------------------------------
  # 26.3 Rasi Gochara Vedha (Obstruction Points)
  # ---------------------------------------------------------------------------
  rasi_gochara_vedha:
    section: "26.3"
    title: "Rasi Gochara Vedha"
    description: >
      Even when a planet is transiting in a favorable house from natal Moon,
      it may be obstructed by another planet transiting in the vedha sthana
      (house of obstruction). In that case, the planet cannot give its
      good results.

    table_63_vedha_sthaanas:
      table_number: 63
      title: "Vedha Sthaanas"
      note: "Auspicious houses from natal Moon with corresponding vedha sthanas in parentheses"
      vedha_pairs:
        Sun:
          - { auspicious_house: 3,  vedha_house: 9 }
          - { auspicious_house: 6,  vedha_house: 12 }
          - { auspicious_house: 10, vedha_house: 4 }
          - { auspicious_house: 11, vedha_house: 5 }
        Moon:
          - { auspicious_house: 1,  vedha_house: 5 }
          - { auspicious_house: 3,  vedha_house: 9 }
          - { auspicious_house: 6,  vedha_house: 12 }
          - { auspicious_house: 7,  vedha_house: 2 }
          - { auspicious_house: 10, vedha_house: 4 }
          - { auspicious_house: 11, vedha_house: 8 }
        Mars:
          - { auspicious_house: 3,  vedha_house: 12 }
          - { auspicious_house: 6,  vedha_house: 9 }
          - { auspicious_house: 11, vedha_house: 5 }
        Mercury:
          - { auspicious_house: 2,  vedha_house: 5 }
          - { auspicious_house: 4,  vedha_house: 3 }
          - { auspicious_house: 6,  vedha_house: 9 }
          - { auspicious_house: 8,  vedha_house: 1 }
          - { auspicious_house: 10, vedha_house: 8 }
          - { auspicious_house: 11, vedha_house: 12 }
        Jupiter:
          - { auspicious_house: 2,  vedha_house: 12 }
          - { auspicious_house: 5,  vedha_house: 4 }
          - { auspicious_house: 7,  vedha_house: 3 }
          - { auspicious_house: 9,  vedha_house: 10 }
          - { auspicious_house: 11, vedha_house: 8 }
        Venus:
          - { auspicious_house: 1,  vedha_house: 8 }
          - { auspicious_house: 2,  vedha_house: 7 }
          - { auspicious_house: 3,  vedha_house: 1 }
          - { auspicious_house: 4,  vedha_house: 10 }
          - { auspicious_house: 5,  vedha_house: 9 }
          - { auspicious_house: 8,  vedha_house: 5 }
          - { auspicious_house: 9,  vedha_house: 11 }
          - { auspicious_house: 11, vedha_house: 6 }
          - { auspicious_house: 12, vedha_house: 3 }
        Saturn:
          - { auspicious_house: 3,  vedha_house: 12 }
          - { auspicious_house: 6,  vedha_house: 9 }
          - { auspicious_house: 11, vedha_house: 5 }

    vedha_exceptions:
      description: "Father and son pairs do not cause vedha on each other"
      pairs:
        - "Sun and Saturn do not cause vedha on each other"
        - "Moon and Mercury do not cause vedha on each other"

  # ---------------------------------------------------------------------------
  # 26.4 Taras (Stars)
  # ---------------------------------------------------------------------------
  taras:
    section: "26.4"
    title: "Taras (Stars)"

    # 26.4.1 Basic Tara Classification
    basic_classification:
      section: "26.4.1"
      description: >
        Count constellations from the constellation of natal Moon to the
        constellation occupied by a planet in transit. Different constellations
        stand for different things. If dasa lord and antardasa lord are in
        bad taras, bad results can be expected.

      table_64_taras:
        table_number: 64
        title: "Taras"
        classifications:
          - { constellations: "1st, 10th, 19th",  name: "Janma Tara",          meaning: "Birth (mixed)" }
          - { constellations: "2nd, 11th, 20th",  name: "Sampat Tara",         meaning: "Wealth (good)" }
          - { constellations: "3rd, 12th, 21st",  name: "Vipat Tara",          meaning: "Danger (bad)" }
          - { constellations: "4th, 13th, 22nd",  name: "Kshema Tara",         meaning: "Well-being (good)" }
          - { constellations: "5th, 14th, 23rd",  name: "Pratyak Tara",        meaning: "Obstacles (bad)" }
          - { constellations: "6th, 15th, 24th",  name: "Saadhana Tara",       meaning: "Achievement (good)" }
          - { constellations: "7th, 16th, 25th",  name: "Naidhana/Vadha Tara", meaning: "Death (bad)" }
          - { constellations: "8th, 17th, 26th",  name: "Mitra Tara",          meaning: "Friend (good)" }
          - { constellations: "9th, 18th, 27th",  name: "Parama Mitra Tara",   meaning: "Best friend (good)" }

      muhurta_usage: >
        Taras are also used in muhurtas. At the time of an auspicious effort
        or when a new project is launched, transit Moon should not be in a
        bad constellation with respect to the natal Moon's constellation.

    # 26.4.2 Special Nakshatras/Taras
    special_nakshatras:
      section: "26.4.2"
      description: "Special nakshatras for each person based on janma nakshatra"
      list:
        - { position: "1st",  name: "Janma nakshatra",       meaning: "Birth",            shows: "General well-being" }
        - { position: "4th",  name: "Jaati nakshatra",        meaning: "Community",         shows: "One's community and people of same class, nature and profession" }
        - { position: "7th",  name: "Naidhana nakshatra",     meaning: "Death",             shows: "Death and suffering" }
        - { position: "10th", name: "Karma nakshatra",        meaning: "Profession",        shows: "Profession and workplace" }
        - { position: "12th", name: "Desa nakshatra",         meaning: "Country",           shows: "One's country" }
        - { position: "13th", name: "Abhisheka nakshatra",    meaning: "Coronation",        shows: "Power and authority (also called Raajya nakshatra)" }
        - { position: "16th", name: "Sanghaatika nakshatra",  meaning: "Belonging to group", shows: "Group/social activities" }
        - { position: "18th", name: "Saamudaayika nakshatra", meaning: "Related to a crowd", shows: "Group activities" }
        - { position: "19th", name: "Aadhaana nakshatra",     meaning: "Epoch/conception",  shows: "Well-being of family" }
        - { position: "22nd", name: "Vainaasika/Vinaasana nakshatra", meaning: "Destructive", shows: "One's destruction" }
        - { position: "25th", name: "Maanasa nakshatra",      meaning: "Mind",              shows: "One's mental state" }

      usage: >
        Benefics or malefics situated in these constellations in transit bring
        good or bad results related to the area covered by the nakshatra.
        Results are with respect to the native (e.g., malefics in desa nakshatra
        may drive one away from one's country, not ruin the country itself).
        Sometimes, using these nakshatras gives special insights that cannot
        be gained by looking at any divisional chart.

  # ---------------------------------------------------------------------------
  # 26.5 Nakshatra-based Aspects
  # ---------------------------------------------------------------------------
  nakshatra_based_aspects:
    section: "26.5"
    title: "Nakshatra-based Aspects"
    description: >
      A natural benefic gives good results related to the constellations
      aspected by it and a natural malefic gives bad results.
    aspects:
      Sun:     "Aspects the 14th and 15th constellations from him"
      Moon:    "Aspects the 14th and 15th constellations from her"
      Mars:    "Aspects the 1st, 3rd, 7th, 8th and 15th constellations from him"
      Mercury: "Aspects the 1st and 15th constellations from him"
      Venus:   "Aspects the 1st and 15th constellations from him"
      Jupiter: "Aspects the 10th, 15th and 19th constellations from him"
      Saturn:  "Aspects the 3rd, 5th, 15th and 19th constellations from him"

  # ---------------------------------------------------------------------------
  # 26.6 Constellations and Body Parts
  # ---------------------------------------------------------------------------
  constellations_and_body_parts:
    section: "26.6"
    title: "Constellations and Body Parts"
    description: >
      When transiting in various constellations counted from janma nakshatra,
      planets are said to dwell in different parts of one's body with
      corresponding standard results. Two purposes: (1) Find standard results
      for planetary transits in different constellations. (2) If a native has
      a disease in a particular body part, figure out the planet causing it
      for remedial and preventive measures.

    # Table 65: Body Parts in the Transit of Sun
    table_65_sun:
      table_number: 65
      title: "Body Parts in the Transit of Sun"
      entries:
        - { nakshatras: "1st",                                           body_part: "Mouth/Face",    result: "Destruction" }
        - { nakshatras: "2nd, 3rd, 4th, 5th",                           body_part: "Head",          result: "Influx of wealth" }
        - { nakshatras: "6th, 7th, 8th, 9th",                           body_part: "Chest",         result: "Victory" }
        - { nakshatras: "10th, 11th, 12th, 13th",                       body_part: "Right hand",    result: "Wealth" }
        - { nakshatras: "14th, 15th, 16th, 17th, 18th, 19th",           body_part: "Two feet",      result: "Poverty" }
        - { nakshatras: "20th, 21st, 22nd, 23rd",                       body_part: "Left hand",     result: "Physical ailments" }
        - { nakshatras: "24th, 25th",                                    body_part: "Eyes",          result: "Gains" }
        - { nakshatras: "26th, 27th",                                    body_part: "Private parts", result: "Death" }

    # Table 66: Body Parts in the Transit of Moon
    table_66_moon:
      table_number: 66
      title: "Body Parts in the Transit of Moon"
      entries:
        - { nakshatras: "1st, 2nd",                                      body_part: "Face",          result: "Great fear" }
        - { nakshatras: "3rd, 4th, 5th, 6th",                           body_part: "Head",          result: "Well-being" }
        - { nakshatras: "7th, 8th",                                      body_part: "Back",          result: "Victory over enemies" }
        - { nakshatras: "9th, 10th",                                     body_part: "Eyes",          result: "Money" }
        - { nakshatras: "11th, 12th, 13th, 14th, 15th",                 body_part: "Heart",         result: "Comforts and peace" }
        - { nakshatras: "16th, 17th, 18th",                              body_part: "Left hand",     result: "Quarrels" }
        - { nakshatras: "19th, 20th, 21st, 22nd, 23rd, 24th",           body_part: "Two feet",      result: "Going abroad" }
        - { nakshatras: "25th, 26th, 27th",                              body_part: "Right hand",    result: "Financial gains" }

    # Table 67: Body Parts in the Transit of Mars
    table_67_mars:
      table_number: 67
      title: "Body Parts in the Transit of Mars"
      entries:
        - { nakshatras: "1st, 2nd",                                      body_part: "Mouth/Face",    result: "Death" }
        - { nakshatras: "3rd, 4th, 5th, 6th, 7th, 8th",                 body_part: "Two feet",      result: "Separation" }
        - { nakshatras: "9th, 10th, 11th",                               body_part: "Chest",         result: "Victory" }
        - { nakshatras: "12th, 13th, 14th, 15th",                       body_part: "Left hand",     result: "Poverty" }
        - { nakshatras: "16th, 17th",                                    body_part: "Head",          result: "Gains" }
        - { nakshatras: "18th, 19th, 20th, 21st",                       body_part: "Face",          result: "Great fear" }
        - { nakshatras: "22nd, 23rd, 24th, 25th",                       body_part: "Right hand",    result: "Well-being" }
        - { nakshatras: "26th, 27th",                                    body_part: "Eyes",          result: "Going abroad" }

    # Table 68: Body Parts in the Transit of Mercury, Jupiter and Venus
    table_68_mercury_jupiter_venus:
      table_number: 68
