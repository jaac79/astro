# from each of the 8 reference points. Rows = houses (1st through 12th),
# Columns = reference planets. A value of 1 means the planet is benefic
# when placed in that house counted from the reference.
#
# Example: In Sun's table, house 3 from Mercury = 1 means Sun is benefic
# when placed in the 3rd house counted from Mercury's position.
# ===========================================================================

