# Ashtakavarga Reference
# Extracted from: Vedic Astrology - An Integrated Approach by P.V.R. Narasimha Rao
# Chapter 12: Ashtakavarga (Book pages 123-141, PDF pages 132-150)

source:
  book: "Vedic Astrology: An Integrated Approach"
  author: "P.V.R. Narasimha Rao"
  chapter: 12
  title: "Ashtakavarga"
  book_pages: "123-141"
  pdf_pages: "132-150"
  authority: "Parasara (BPHS)"

# ===========================================================================
# CONCEPT
# ===========================================================================
concept:
  meaning: "Ashtaka = consisting of eight; Varga = a group"
  definition: >
    Ashtakavarga is the system of analyzing a chart with respect to a group
    of 8 reference points (Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn,
    and Lagna).
  purpose: >
    Tells us the benefic positions of lagna and seven planets with respect
    to each other. Can be used to analyze the strength of a natal chart,
    but is much more important in analyzing transits.
  eight_references:
    - Sun
    - Moon
    - Mars
    - Mercury
    - Jupiter
    - Venus
    - Saturn
    - Lagna
  terminology:
    rekha:
      symbol: 1
      meaning: "Line - benefic position (sthana)"
    bindu:
      symbol: 0
      meaning: "Dot - malefic position (karana)"
    note: >
      Some south Indian astrologers use opposite convention (bindu=benefic,
      rekha=malefic). This book follows Parasara's convention.

# ===========================================================================
